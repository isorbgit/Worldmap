<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>다로노아 월드맵 기획 툴</title>
<style>
:root{
  --bg:#14171c; --panel:#1c2027; --panel-2:#232830;
  --line:#2e343d; --line-soft:#262b33;
  --txt:#dde2e9; --txt-dim:#8b95a3; --txt-faint:#5d6673;
  --accent:#9d7cd8; --accent-soft:#6b4fa0;
  --warn:#d97a5c; --ok:#6fae7a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--txt);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:none;cursor:pointer;touch-action:manipulation}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#343b45;border-radius:5px}

#app{display:flex;flex-direction:column;height:100%}

#topbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px;flex:0 0 auto;
  background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
#topbar::-webkit-scrollbar{display:none}
#brand{display:flex;flex-direction:column;line-height:1.2;padding-right:4px;flex:0 0 auto}
#brand b{font-size:13.5px;font-weight:600}
#brand span{font-size:10px;color:var(--txt-faint)}
.zoomrow{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:9px;flex:0 0 auto}
.zbtn{padding:5px 9px;border-radius:6px;font-size:10.5px;color:var(--txt-dim);
  display:flex;flex-direction:column;align-items:center;line-height:1.25;min-width:48px}
.zbtn b{font-size:12px;font-weight:600}
.zbtn.on{background:var(--accent-soft);color:#fff}
.zbtn.on b{color:#fff}
.spacer{flex:1;min-width:4px}
.tbtn{padding:8px 11px;border-radius:8px;border:1px solid var(--line);color:var(--txt-dim);
  background:var(--panel-2);font-size:12px;white-space:nowrap;flex:0 0 auto}
.tbtn.pri{background:var(--accent-soft);border-color:var(--accent-soft);color:#fff}
.tbtn.busy{opacity:.5;pointer-events:none}
#savestate{font-size:10.5px;color:var(--txt-faint);white-space:nowrap;flex:0 0 auto;
  max-width:160px;text-align:right;line-height:1.3}
#savestate.unsaved{color:var(--warn)}

#body{display:flex;flex:1;min-height:0;position:relative}

#rail{width:128px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.sect{padding:9px 9px 11px;border-bottom:1px solid var(--line-soft)}
.sect h3{font-size:10.5px;font-weight:500;color:var(--txt-faint);margin-bottom:6px}
.toolbtn{display:flex;align-items:center;gap:7px;width:100%;padding:8px;border-radius:7px;
  color:var(--txt-dim);font-size:12px;text-align:left}
.toolbtn .k{margin-left:auto;font-size:9.5px;color:var(--txt-faint)}
.toolbtn.on{background:var(--accent-soft);color:#fff}
.toolbtn.on .k{color:#d9c9f2}
.toolbtn svg{width:15px;height:15px;flex:0 0 auto}
.slab{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-dim);margin:8px 0 2px}
.slab i{color:var(--txt);font-style:normal}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.chk{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt-dim);padding:5px 0;cursor:pointer}
.chk input{accent-color:var(--accent);margin:0;width:16px;height:16px;flex:0 0 auto}

#stage{flex:1;position:relative;min-width:0;background:#0f1216;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#mini{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:5px;box-shadow:0 8px 26px rgba(0,0,0,.5);touch-action:none}
#minicv{display:block;border-radius:3px}
#hud{position:absolute;right:10px;top:10px;display:flex;gap:5px;flex-wrap:wrap;
  justify-content:flex-end;pointer-events:none;max-width:70%}
.chip{background:rgba(20,23,28,.9);border:1px solid var(--line);border-radius:7px;
  padding:4px 8px;font-size:10.5px;color:var(--txt-dim);backdrop-filter:blur(6px)}
.chip b{color:var(--txt);font-weight:600}
#zoombtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:5px}
#zoombtns button{width:44px;height:44px;border-radius:11px;background:rgba(28,32,39,.94);
  border:1px solid var(--line);color:var(--txt-dim);font-size:19px;
  box-shadow:0 4px 16px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
#zoombtns button:active{background:var(--accent-soft);color:#fff}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-size:12px;
  box-shadow:0 8px 26px rgba(0,0,0,.5);opacity:0;transition:opacity .18s;pointer-events:none;
  max-width:78%;text-align:center}
#toast.show{opacity:1}

#insp{width:302px;flex:0 0 auto;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
#insphd{padding:9px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;display:flex;align-items:center;gap:8px}
#insphd h2{font-size:13px;font-weight:600}
#insphd .sub{font-size:11px;color:var(--txt-faint);margin-left:auto}
#inspclose{display:none;color:var(--txt-dim);font-size:18px;padding:0 4px}
#inspbody{flex:1;overflow-y:auto;padding:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.empty{color:var(--txt-faint);font-size:12px;line-height:1.7;padding:6px 2px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--txt-faint);margin-bottom:4px}
.fld input[type=text],.fld textarea,.fld select{width:100%;background:var(--panel-2);
  border:1px solid var(--line);border-radius:7px;padding:9px;font-size:16px}
.fld textarea{resize:vertical;min-height:92px;line-height:1.6;font-size:15px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent-soft)}
.navrow{display:flex;align-items:center;gap:5px;margin-bottom:10px}
.navrow .coord{flex:1;text-align:center;background:var(--panel-2);border-radius:7px;padding:7px;
  font-size:13px;font-weight:600}
.navrow .coord small{display:block;font-size:10px;font-weight:400;color:var(--txt-faint)}
.nb{width:38px;height:40px;border-radius:8px;background:var(--panel-2);color:var(--txt-dim);font-size:15px}
.crow{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
.sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.4)}
.crow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .pc{color:var(--txt-dim);font-size:11px}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;display:flex;margin:5px 0 9px}
.bar div{height:100%}
.actrow{display:flex;gap:6px;margin-bottom:10px}
.actrow button{flex:1;padding:10px 6px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--txt-dim);font-size:11.5px}
hr.sep{border:none;border-top:1px solid var(--line-soft);margin:13px 0}

#palwrap{padding:11px;border-top:1px solid var(--line);flex:0 0 auto;max-height:46%;
  overflow-y:auto;overscroll-behavior:contain}
#palwrap h3{font-size:10.5px;color:var(--txt-faint);margin-bottom:7px;display:flex;align-items:center}
#palwrap h3 button{margin-left:auto;color:var(--txt-dim);font-size:11px;padding:3px 6px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pitem{display:flex;align-items:center;gap:6px;padding:8px 6px;border-radius:7px;font-size:11.5px;
  color:var(--txt-dim);cursor:pointer;border:1px solid transparent;text-align:left}
.pitem.on{border-color:var(--accent);background:#2a2338;color:#fff}
.pitem .sw{width:13px;height:13px}
.pitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pitem .blk{font-size:9px;color:var(--warn)}
.pitem .ed{color:var(--txt-faint);font-size:12px;padding:0 3px}
.paledit{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px}
.paledit .r{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.paledit input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:8px;font-size:16px}
.paledit input[type=color]{width:38px;height:36px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.paledit .btns{display:flex;gap:6px}
.paledit .btns button{flex:1;padding:9px;border-radius:6px;font-size:11.5px;background:var(--bg);
  border:1px solid var(--line);color:var(--txt-dim)}
.paledit .btns button.pri{background:var(--accent-soft);border-color:var(--accent-soft);color:#fff}
.paledit .btns button.del{color:var(--warn)}

.pinlist{display:flex;flex-direction:column;gap:3px;margin-bottom:11px}
.pinrow{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;
  cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.pinrow.on{border-color:var(--accent);background:#2a2338}
.pinrow .ic{font-size:15px;width:20px;text-align:center;flex:0 0 auto}
.pinrow .tt{flex:1;min-width:0;overflow:hidden}
.pinrow .tt b{display:block;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinrow .tt small{color:var(--txt-faint);font-size:10.5px}
.kindgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.kindgrid button{padding:9px 2px;border-radius:8px;background:var(--panel-2);
  border:1px solid transparent;font-size:16px;color:var(--txt-dim)}
.kindgrid button small{display:block;font-size:9.5px;margin-top:2px}
.kindgrid button.on{border-color:var(--accent);background:#2a2338;color:#fff}

#sheet{position:fixed;inset:0;background:rgba(8,10,13,.72);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px}
#sheet.on{display:flex}
#sheetbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px;width:min(430px,100%);max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#sheetbox h3{font-size:14px;margin-bottom:4px}
#sheetbox p{font-size:12px;color:var(--txt-dim);margin-bottom:14px;line-height:1.65}
#sheetbox .opt{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
#sheetbox .opt button{padding:12px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--txt);font-size:12.5px;text-align:left;width:100%}
#sheetbox .opt button small{display:block;color:var(--txt-faint);font-size:10.5px;margin-top:2px}
#sheetbox .close{width:100%;padding:11px;border-radius:9px;background:none;
  border:1px solid var(--line);color:var(--txt-dim);font-size:12px}

#inspToggle{display:none}
@media (max-width:1150px){
  #rail{width:62px}
  #rail .sect h3{display:none}
  .toolbtn{justify-content:center;padding:11px 4px;font-size:0;gap:0}
  .toolbtn .k{display:none}
  .toolbtn span:not(.k){display:none}
  .toolbtn svg{width:19px;height:19px}
  .chk{font-size:9.5px;flex-direction:column;gap:3px;text-align:center;padding:6px 0}
  .slab{font-size:9.5px;flex-direction:column;gap:0;text-align:center}
  #insp{position:absolute;right:0;top:0;bottom:0;z-index:30;width:320px;
    transform:translateX(101%);transition:transform .22s ease;box-shadow:-14px 0 40px rgba(0,0,0,.5)}
  #insp.open{transform:none}
  #inspclose{display:block}
  #inspToggle{display:block}
  #brand span{display:none}
}
@media (max-width:700px){
  #insp{width:100%}
  #brand{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="brand"><b>다로노아 월드맵</b><span>32 × 48 필드 · 1,966m × 2,949m</span></div>
    <div class="zoomrow" id="zoomrow"></div>
    <div class="spacer"></div>
    <button class="tbtn" id="btnCheck">연결성</button>
    <button class="tbtn" id="btnPng">PNG</button>
    <button class="tbtn" id="btnLoad">열기</button>
    <button class="tbtn pri" id="btnSave">저장</button>
    <button class="tbtn" id="inspToggle">패널</button>
    <span id="savestate"></span>
  </div>

  <div id="body">
    <div id="rail">
      <div class="sect"><h3>도구</h3><div id="tools"></div></div>
      <div class="sect">
        <div class="slab">붓 <i id="bsv">16셀</i></div>
        <input type="range" id="bs" min="0" max="6" step="1" value="4">
        <div class="slab" id="denlab" style="display:none">밀도 <i id="denv">35%</i></div>
        <input type="range" id="den" min="5" max="100" step="5" value="35" style="display:none">
      </div>
      <div class="sect">
        <h3>표시</h3>
        <label class="chk" title="필드 격자"><input type="checkbox" id="cGrid" checked><span>격자</span></label>
        <label class="chk" title="필드 좌표"><input type="checkbox" id="cLabel" checked><span>좌표</span></label>
        <label class="chk" title="핀 항상 보기"><input type="checkbox" id="cPins"><span>핀</span></label>
        <label class="chk" title="통행 불가 강조"><input type="checkbox" id="cBlock"><span>벽</span></label>
        <label class="chk" title="고립 구역"><input type="checkbox" id="cIso" checked><span>고립</span></label>
      </div>
      <div class="sect">
        <h3>입력</h3>
        <label class="chk" title="손가락으로도 그리기"><input type="checkbox" id="cFinger"><span>손그리기</span></label>
      </div>
      <div class="sect">
        <h3>편집</h3>
        <button class="toolbtn" id="btnUndo" title="되돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg><span>되돌리기</span></button>
        <button class="toolbtn" id="btnReset" title="전체 비우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg><span>전체 비우기</span></button>
      </div>
    </div>

    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hud"></div>
      <div id="mini"><canvas id="minicv"></canvas></div>
      <div id="zoombtns"><button id="zIn">＋</button><button id="zOut">－</button></div>
      <div id="toast"></div>
    </div>

    <div id="insp">
      <div id="insphd"><h2 id="inspttl">인스펙터</h2><span class="sub" id="inspsub"></span><button id="inspclose">✕</button></div>
      <div id="inspbody"></div>
      <div id="palwrap">
        <h3>지형 <button id="btnAddT">+ 추가</button></h3>
        <div id="paledithost"></div>
        <div class="pal" id="pal"></div>
      </div>
    </div>
  </div>
</div>

<div id="sheet"><div id="sheetbox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* ═══ 다로노아 월드맵 기획 툴 ═══
   필드 2048게임px = 128셀 → 1셀 = 16게임px = 48cm
   펜슬 = 그리기 / 손가락 = 이동·핀치줌
   ═══════════════════════════════ */

const CPF=128, FX=32, FY=48;
const WX=FX*CPF, WY=FY*CPF;
const CM=48, GPX=16;
const MINS=1/8, MAXS=16;

const ZOOMS=[
  {s:1/8,n:"Z0",t:"세계"},{s:1/4,n:"Z1",t:"지방"},
  {s:1,n:"Z2",t:"지역"},{s:4,n:"Z3",t:"근접"},{s:16,n:"Z4",t:"상세"},
];
const PIN_SCALE_MAX=0.5;
const BRUSH_SIZES=[1,2,4,8,16,32,64];

const PIN_KINDS=[
  {id:"town",ic:"🏘",nm:"거점"},{id:"dgn",ic:"⛩",nm:"던전"},
  {id:"boss",ic:"☠",nm:"보스"},{id:"event",ic:"❗",nm:"사건"},
  {id:"port",ic:"⛵",nm:"항로"},{id:"gate",ic:"🚪",nm:"관문"},
  {id:"shrine",ic:"🕯",nm:"신전"},{id:"memo",ic:"📝",nm:"메모"},
];

const DEFAULT_PALETTE=[
  {nm:"미지정",c:"#1a1e24",walk:false},
  {nm:"푸른 풀밭",c:"#5b8c42",walk:true},{nm:"마른 풀밭",c:"#a4913f",walk:true},
  {nm:"관목지",c:"#4a6b3a",walk:true},{nm:"숲",c:"#2d5432",walk:true},
  {nm:"농지",c:"#8a9440",walk:true},{nm:"흙길",c:"#8a6a45",walk:true},
  {nm:"포석길",c:"#9c9689",walk:true},{nm:"자갈밭",c:"#8f8c85",walk:true},
  {nm:"모래밭",c:"#d4c08c",walk:true},{nm:"바위언덕",c:"#7a6f63",walk:true},
  {nm:"바위산",c:"#55504a",walk:false},{nm:"절벽",c:"#302d29",walk:false},
  {nm:"호숫가",c:"#7d9a86",walk:true},{nm:"얕은 물",c:"#5a93a8",walk:true},
  {nm:"호수",c:"#2e5c7a",walk:false},{nm:"강",c:"#39719e",walk:false},
  {nm:"늪지",c:"#4e5c3e",walk:true},{nm:"눈밭",c:"#dbe3ea",walk:true},
  {nm:"폐허",c:"#6b6259",walk:true},{nm:"화산암",c:"#4a3833",walk:false},
];
const STATUSES=["미착수","초안","확정","보류"];

const S={
  pal:DEFAULT_PALETTE.map(p=>({...p})),
  fields:new Map(), meta:new Map(), pins:[], pinSeq:1,
  scale:1, cam:{x:WX/2,y:WY/2},
  tool:"brush", terrain:1, brush:4, density:35,
  selField:null, selPin:null, iso:null, fingerDraw:false,
  show:{grid:true,label:true,pins:false,block:false,iso:true},
};

const cache=new Map(); const undoStack=[];
let dirty=true, unsaved=false;
const fk=(a,b)=>a+","+b;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hexRGB(h){h=h.replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255];}

function getField(fx,fy,c){const k=fk(fx,fy);let f=S.fields.get(k);
  if(!f&&c){f=new Uint8Array(CPF*CPF);S.fields.set(k,f);}return f;}
function getMeta(fx,fy,c){const k=fk(fx,fy);let m=S.meta.get(k);
  if(!m&&c){m={nm:"",tags:"",notes:"",status:"미착수"};S.meta.set(k,m);}return m;}
function getCell(cx,cy){if(cx<0||cy<0||cx>=WX||cy>=WY)return 0;
  const f=S.fields.get(fk(cx>>7,cy>>7));return f?f[(cy&127)*CPF+(cx&127)]:0;}
function setCell(cx,cy,v){if(cx<0||cy<0||cx>=WX||cy>=WY)return false;
  const fx=cx>>7,fy=cy>>7,f=getField(fx,fy,true),i=(cy&127)*CPF+(cx&127);
  if(f[i]===v)return false;f[i]=v;cache.delete(fk(fx,fy));return true;}

let snap=null;
function beginStroke(){snap=new Map();}
function snapField(fx,fy){if(!snap)return;const k=fk(fx,fy);if(snap.has(k))return;
  const f=S.fields.get(k);snap.set(k,f?f.slice():null);}
function endStroke(){if(!snap||!snap.size){snap=null;return;}
  undoStack.push(snap);if(undoStack.length>30)undoStack.shift();snap=null;touchSave();}
function undo(){const s=undoStack.pop();
  if(!s){toast("되돌릴 작업이 없습니다");return;}
  for(const[k,a]of s){if(a===null)S.fields.delete(k);else S.fields.set(k,a);cache.delete(k);}
  S.iso=null;dirty=true;renderInspector();touchSave();}

const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
const mcv=document.getElementById("minicv"),mctx=mcv.getContext("2d");
let VW=0,VH=0,DPR=1;
function resize(){
  const st=document.getElementById("stage");
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=st.clientWidth;VH=st.clientHeight;
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const mw=clamp(Math.round(VW*0.11),80,140);
  mcv.width=mw;mcv.height=Math.round(mw*WY/WX);
  mcv.style.width=mw+"px";mcv.style.height=mcv.height+"px";
  clampCam();dirty=true;
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",()=>setTimeout(resize,240));

const zs=()=>S.scale;
function s2c(px,py){const z=zs();return[S.cam.x+(px-VW/2)/z,S.cam.y+(py-VH/2)/z];}
function c2s(cx,cy){const z=zs();return[(cx-S.cam.x)*z+VW/2,(cy-S.cam.y)*z+VH/2];}
function clampCam(){const z=zs(),hw=VW/2/z,hh=VH/2/z;
  S.cam.x=WX<=hw*2?WX/2:clamp(S.cam.x,hw,WX-hw);
  S.cam.y=WY<=hh*2?WY/2:clamp(S.cam.y,hh,WY-hh);}
function levelIdx(){let b=0,bd=1e9;
  for(let i=0;i<ZOOMS.length;i++){const d=Math.abs(Math.log2(S.scale/ZOOMS[i].s));if(d<bd){bd=d;b=i;}}
  return b;}
const pinMode=()=>S.scale<=PIN_SCALE_MAX;
function setScale(ns,ax,ay){
  ns=clamp(ns,MINS,MAXS);
  if(Math.abs(ns-S.scale)<1e-9)return;
  if(ax===undefined){ax=VW/2;ay=VH/2;}
  const[bx,by]=s2c(ax,ay);
  const was=pinMode();S.scale=ns;
  S.cam.x=bx-(ax-VW/2)/ns;S.cam.y=by-(ay-VH/2)/ns;
  clampCam();renderZoom();dirty=true;
  if(was!==pinMode())renderInspector();
}

let palRGB=[];
const rebuildPal=()=>palRGB=S.pal.map(p=>hexRGB(p.c));
rebuildPal();
function fieldCanvas(fx,fy){
  const k=fk(fx,fy);let c=cache.get(k);if(c)return c;
  const f=S.fields.get(k);if(!f)return null;
  c=document.createElement("canvas");c.width=CPF;c.height=CPF;
  const x=c.getContext("2d"),img=x.createImageData(CPF,CPF),d=img.data,blk=S.show.block;
  for(let i=0;i<f.length;i++){
    const id=f[i],o=i*4;
    if(!id){d[o+3]=0;continue;}
    const g=palRGB[id]||[255,0,255];let r=g[0],gg=g[1],b=g[2];
    if(blk&&S.pal[id]&&!S.pal[id].walk){r=(r+230)>>1;gg=(gg+90)>>1;b=(b+70)>>1;}
    d[o]=r;d[o+1]=gg;d[o+2]=b;d[o+3]=255;
  }
  x.putImageData(img,0,0);cache.set(k,c);return c;
}

const IR=4,IW=WX/IR,IH=WY/IR;
function checkConnectivity(){
  const walk=new Uint8Array(IW*IH);let total=0;
  for(const[k,f]of S.fields){
    const[fx,fy]=k.split(",").map(Number),bx=fx*CPF/IR,by=fy*CPF/IR,n=CPF/IR;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      let w=0;
      for(let dy=0;dy<IR;dy++)for(let dx=0;dx<IR;dx++){
        const id=f[(y*IR+dy)*CPF+x*IR+dx];
        if(id&&S.pal[id]&&S.pal[id].walk)w++;
      }
      if(w>IR*IR/2){walk[(by+y)*IW+bx+x]=1;total++;}
    }
  }
  if(!total){S.iso=null;dirty=true;toast("검사할 통행 가능 지형이 없습니다");return;}
  const lab=new Int32Array(IW*IH).fill(-1),q=new Int32Array(total+8),sizes=[];
  for(let st=0;st<walk.length;st++){
    if(!walk[st]||lab[st]>=0)continue;
    const id=sizes.length;let h=0,t=0,c=0;q[t++]=st;lab[st]=id;
    while(h<t){
      const p=q[h++];c++;const x=p%IW,y=(p-x)/IW;
      if(x>0){const n=p-1;if(walk[n]&&lab[n]<0){lab[n]=id;q[t++]=n;}}
      if(x<IW-1){const n=p+1;if(walk[n]&&lab[n]<0){lab[n]=id;q[t++]=n;}}
      if(y>0){const n=p-IW;if(walk[n]&&lab[n]<0){lab[n]=id;q[t++]=n;}}
      if(y<IH-1){const n=p+IW;if(walk[n]&&lab[n]<0){lab[n]=id;q[t++]=n;}}
    }
    sizes.push(c);
  }
  let main=0;for(let i=1;i<sizes.length;i++)if(sizes[i]>sizes[main])main=i;
  const iso=new Uint8Array(IW*IH);let n=0;
  for(let i=0;i<lab.length;i++)if(lab[i]>=0&&lab[i]!==main){iso[i]=1;n++;}
  S.iso=n?iso:null;
  document.getElementById("cIso").checked=true;S.show.iso=true;dirty=true;
  const cnt=sizes.length-1,area=(n*IR*IR*CM*CM/10000).toFixed(0);
  toast(cnt===0?"고립 구역 없음. 전체가 하나로 이어져 있습니다."
               :`고립 구역 ${cnt}개 · 총 ${area}㎡ — 붉게 표시했습니다`);
}

function draw(){
  const z=zs();
  ctx.clearRect(0,0,VW,VH);
  const[ox,oy]=c2s(0,0),[ex,ey]=c2s(WX,WY);
  ctx.fillStyle="#171b21";ctx.fillRect(ox,oy,ex-ox,ey-oy);

  const[c0x,c0y]=s2c(0,0),[c1x,c1y]=s2c(VW,VH);
  const f0x=clamp(Math.floor(c0x/CPF),0,FX-1),f1x=clamp(Math.floor(c1x/CPF),0,FX-1);
  const f0y=clamp(Math.floor(c0y/CPF),0,FY-1),f1y=clamp(Math.floor(c1y/CPF),0,FY-1);
  ctx.imageSmoothingEnabled=z<1;
  const fpx=CPF*z;
  for(let fy=f0y;fy<=f1y;fy++)for(let fx=f0x;fx<=f1x;fx++){
    const c=fieldCanvas(fx,fy);if(!c)continue;
    const[sx,sy]=c2s(fx*CPF,fy*CPF);
    ctx.drawImage(c,sx,sy,fpx,fpx);
  }
  ctx.imageSmoothingEnabled=false;

  if(S.iso&&S.show.iso){
    ctx.save();ctx.fillStyle="#e2503f";
    ctx.globalAlpha=.35+.2*Math.sin(Date.now()/333);
    const ip=IR*z;
    const i0x=clamp(Math.floor(c0x/IR),0,IW-1),i1x=clamp(Math.ceil(c1x/IR),0,IW-1);
    const i0y=clamp(Math.floor(c0y/IR),0,IH-1),i1y=clamp(Math.ceil(c1y/IR),0,IH-1);
    for(let y=i0y;y<=i1y;y++)for(let x=i0x;x<=i1x;x++){
      if(!S.iso[y*IW+x])continue;
      const[sx,sy]=c2s(x*IR,y*IR);
      ctx.fillRect(sx,sy,Math.max(1,ip),Math.max(1,ip));
    }
    ctx.restore();dirty=true;
  }

  if(z>=4&&S.show.grid){
    ctx.strokeStyle="rgba(255,255,255,.05)";ctx.lineWidth=1;ctx.beginPath();
    for(let cx=Math.ceil(c0x);cx<=c1x;cx++){const[sx]=c2s(cx,0);ctx.moveTo(sx+.5,0);ctx.lineTo(sx+.5,VH);}
    for(let cy=Math.ceil(c0y);cy<=c1y;cy++){const[,sy]=c2s(0,cy);ctx.moveTo(0,sy+.5);ctx.lineTo(VW,sy+.5);}
    ctx.stroke();
  }
  if(S.show.grid){
    ctx.strokeStyle=z>=1?"rgba(255,255,255,.14)":"rgba(255,255,255,.09)";
    ctx.lineWidth=1;ctx.beginPath();
    for(let fx=f0x;fx<=f1x+1;fx++){const[sx]=c2s(fx*CPF,0);ctx.moveTo(sx+.5,Math.max(0,oy));ctx.lineTo(sx+.5,Math.min(VH,ey));}
    for(let fy=f0y;fy<=f1y+1;fy++){const[,sy]=c2s(0,fy*CPF);ctx.moveTo(Math.max(0,ox),sy+.5);ctx.lineTo(Math.min(VW,ex),sy+.5);}
    ctx.stroke();
  }
  if(S.show.label&&fpx>=46){
    ctx.textBaseline="top";
    for(let fy=f0y;fy<=f1y;fy++)for(let fx=f0x;fx<=f1x;fx++){
      const[sx,sy]=c2s(fx*CPF,fy*CPF),m=S.meta.get(fk(fx,fy));
      ctx.font="500 10px ui-monospace,Menlo,monospace";
      ctx.fillStyle="rgba(255,255,255,.3)";ctx.fillText(fx+","+fy,sx+4,sy+3);
      if(m&&m.nm&&fpx>=90){
        ctx.font="600 11px -apple-system,sans-serif";
        ctx.fillStyle="rgba(255,255,255,.72)";ctx.fillText(m.nm,sx+4,sy+16);
      }
    }
    ctx.textBaseline="alphabetic";
  }
  if(S.selField&&!pinMode()){
    const[sx,sy]=c2s(S.selField[0]*CPF,S.selField[1]*CPF);
    ctx.strokeStyle="#9d7cd8";ctx.lineWidth=2;ctx.strokeRect(sx+1,sy+1,fpx-2,fpx-2);
  }
  if(pinMode()||S.show.pins){
    for(const p of S.pins){
      const[sx,sy]=c2s(p.cx,p.cy);
      if(sx<-40||sy<-40||sx>VW+40||sy>VH+40)continue;
      const on=S.selPin===p.id,r=on?16:14;
      ctx.beginPath();ctx.arc(sx,sy,r,0,7);
      ctx.fillStyle=on?"#9d7cd8":"rgba(24,27,33,.92)";ctx.fill();
      ctx.strokeStyle=on?"#e2d6f7":"rgba(157,124,216,.85)";
      ctx.lineWidth=on?2:1.5;ctx.stroke();
      const kd=PIN_KINDS.find(k=>k.id===p.kind)||PIN_KINDS[7];
      ctx.font="14px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillStyle="#fff";ctx.fillText(kd.ic,sx,sy+.5);
      if(p.title&&(on||z>=1/4)){
        ctx.font="600 11px -apple-system,sans-serif";ctx.textBaseline="top";
        const w=ctx.measureText(p.title).width;
        ctx.fillStyle="rgba(20,23,28,.86)";ctx.fillRect(sx-w/2-5,sy+r+3,w+10,16);
        ctx.fillStyle=on?"#e2d6f7":"rgba(255,255,255,.8)";ctx.fillText(p.title,sx,sy+r+5);
      }
      ctx.textAlign="left";ctx.textBaseline="alphabetic";
    }
  }
  if(hoverOn&&/brush|eraser|scatter/.test(S.tool)){
    const n=BRUSH_SIZES[S.brush];
    const[cx,cy]=s2c(hoverX,hoverY);
    const bx=Math.floor(cx/n)*n,by=Math.floor(cy/n)*n;
    const[sx,sy]=c2s(bx,by);
    ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=1.5;
    ctx.strokeRect(sx+.5,sy+.5,Math.max(4,n*z),Math.max(4,n*z));
  }
  if(rectDrag){
    const a=rectDrag.a,b=rectDrag.b;
    const x0=Math.min(a[0],b[0]),y0=Math.min(a[1],b[1]);
    const x1=Math.max(a[0],b[0])+1,y1=Math.max(a[1],b[1])+1;
    const[sx,sy]=c2s(x0,y0),[e2,f2]=c2s(x1,y1);
    ctx.fillStyle=S.pal[S.terrain].c+"88";ctx.fillRect(sx,sy,e2-sx,f2-sy);
    ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.strokeRect(sx+.5,sy+.5,e2-sx,f2-sy);
  }
  ctx.strokeStyle="rgba(157,124,216,.3)";ctx.lineWidth=1;
  ctx.strokeRect(ox+.5,oy+.5,ex-ox,ey-oy);
  drawMini();drawHud();
}
function drawMini(){
  const w=mcv.width,h=mcv.height;
  mctx.clearRect(0,0,w,h);mctx.fillStyle="#12151a";mctx.fillRect(0,0,w,h);
  const sx=w/FX,sy=h/FY;
  for(const[k,f]of S.fields){
    const[fx,fy]=k.split(",").map(Number);
    const hist=new Uint16Array(S.pal.length);
    for(let i=0;i<f.length;i+=13)hist[f[i]]++;
    let best=0,bv=0;
    for(let i=1;i<hist.length;i++)if(hist[i]>bv){bv=hist[i];best=i;}
    if(!best)continue;
    mctx.fillStyle=S.pal[best].c;
    mctx.fillRect(fx*sx,fy*sy,Math.ceil(sx),Math.ceil(sy));
  }
  const z=zs();
  mctx.strokeStyle="#9d7cd8";mctx.lineWidth=1.5;
  mctx.strokeRect((S.cam.x-VW/2/z)/WX*w,(S.cam.y-VH/2/z)/WY*h,
    Math.max(2,VW/z/WX*w),Math.max(2,VH/z/WY*h));
}
function drawHud(){
  const[cx,cy]=s2c(hoverOn?hoverX:VW/2,hoverOn?hoverY:VH/2);
  const icx=Math.floor(cx),icy=Math.floor(cy);
  const ok=icx>=0&&icy>=0&&icx<WX&&icy<WY;
  const id=ok?getCell(icx,icy):0;
  document.getElementById("hud").innerHTML=
    `<span class="chip">폭 <b>${(VW/zs()*CM/100).toFixed(0)}m</b></span>`+
    `<span class="chip">필드 <b>${ok?(icx>>7)+","+(icy>>7):"—"}</b></span>`+
    `<span class="chip">지형 <b>${ok?S.pal[id].nm:"—"}</b></span>`+
    `<span class="chip">작업 <b>${S.fields.size}</b>/${FX*FY}</span>`;
}
function loop(){if(dirty){dirty=false;draw();}requestAnimationFrame(loop);}

function stamp(cx,cy,val,scatter){
  const n=BRUSH_SIZES[S.brush];
  const bx=Math.floor(cx/n)*n,by=Math.floor(cy/n)*n,p=S.density/100;
  for(let fy=by>>7;fy<=(by+n-1)>>7;fy++)for(let fx=bx>>7;fx<=(bx+n-1)>>7;fx++)
    if(fx>=0&&fy>=0&&fx<FX&&fy<FY)snapField(fx,fy);
  let ch=false;
  for(let y=by;y<by+n;y++)for(let x=bx;x<bx+n;x++){
    if(scatter&&Math.random()>p)continue;
    if(setCell(x,y,val))ch=true;
  }
  if(ch){dirty=true;S.iso=null;}
}
function line(a,b,val,scatter){
  const dx=b[0]-a[0],dy=b[1]-a[1];
  const step=Math.max(1,BRUSH_SIZES[S.brush]/2);
  const n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/step));
  for(let i=1;i<=n;i++)stamp(Math.round(a[0]+dx*i/n),Math.round(a[1]+dy*i/n),val,scatter);
}
function fillRect(a,b,val){
  const x0=clamp(Math.min(a[0],b[0]),0,WX-1),y0=clamp(Math.min(a[1],b[1]),0,WY-1);
  const x1=clamp(Math.max(a[0],b[0]),0,WX-1),y1=clamp(Math.max(a[1],b[1]),0,WY-1);
  beginStroke();
  for(let fy=y0>>7;fy<=y1>>7;fy++)for(let fx=x0>>7;fx<=x1>>7;fx++)snapField(fx,fy);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)setCell(x,y,val);
  endStroke();S.iso=null;dirty=true;
}
function bucket(sx,sy,val){
  const from=getCell(sx,sy);if(from===val)return;
  const LIM=3000000,seen=new Set();beginStroke();
  const st=[sx|0,sy|0];let c=0;
  while(st.length){
    const y=st.pop(),x=st.pop();
    if(x<0||y<0||x>=WX||y>=WY)continue;
    const key=y*WX+x;if(seen.has(key))continue;
    if(getCell(x,y)!==from)continue;
    seen.add(key);snapField(x>>7,y>>7);setCell(x,y,val);
    if(++c>LIM){toast("채우기 한도(300만 셀)에 도달해 중단했습니다");break;}
    st.push(x+1,y,x-1,y,x,y+1,x,y-1);
  }
  endStroke();S.iso=null;dirty=true;
}
function fillField(fx,fy,val){
  beginStroke();snapField(fx,fy);
  const f=getField(fx,fy,true);f.fill(val);cache.delete(fk(fx,fy));
  endStroke();S.iso=null;dirty=true;renderInspector();
}

/* ═══ 입력: 펜슬은 그리기, 손가락은 이동·핀치 ═══ */
const ptrs=new Map();
let drawId=null,lastCell=null,rectDrag=null,pinDrag=null;
let panId=null,panPrev=null,pinch=null;
let hoverX=0,hoverY=0,hoverOn=false;

function cellOf(e){const[cx,cy]=s2c(e.offsetX,e.offsetY);return[Math.floor(cx),Math.floor(cy)];}
const touchList=()=>[...ptrs.values()].filter(p=>p.type==="touch");

cv.addEventListener("pointerdown",e=>{
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY,type:e.pointerType});
  hoverX=e.offsetX;hoverY=e.offsetY;hoverOn=true;

  const t=touchList();
  if(t.length>=2){
    abortDraw();
    const[a,b]=t;
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
    panId=null;panPrev=null;return;
  }
  const forcePan=e.pointerType==="mouse"&&(e.button===1||e.button===2||e.shiftKey);
  if(forcePan||S.tool==="pan"||(e.pointerType==="touch"&&!S.fingerDraw)){
    panId=e.pointerId;panPrev={x:e.offsetX,y:e.offsetY};
    cv.style.cursor="grabbing";return;
  }
  if(e.pointerType==="mouse"&&e.button!==0)return;
  startDraw(e);
});

function startDraw(e){
  const[icx,icy]=cellOf(e);
  if(pinMode()||S.show.pins){
    const hit=hitPin(e.offsetX,e.offsetY);
    if(hit&&S.tool!=="pin"){selectPin(hit.id);return;}
    if(S.tool==="pin"){
      if(hit){selectPin(hit.id);pinDrag=hit;drawId=e.pointerId;return;}
      addPin(icx,icy);return;
    }
  }
  if(icx<0||icy<0||icx>=WX||icy>=WY)return;
  drawId=e.pointerId;lastCell=[icx,icy];
  switch(S.tool){
    case"brush":  beginStroke();stamp(icx,icy,S.terrain,false);selectField(icx>>7,icy>>7,true);break;
    case"scatter":beginStroke();stamp(icx,icy,S.terrain,true); selectField(icx>>7,icy>>7,true);break;
    case"eraser": beginStroke();stamp(icx,icy,0,false);        selectField(icx>>7,icy>>7,true);break;
    case"rect":   rectDrag={a:[icx,icy],b:[icx,icy]};break;
    case"bucket": bucket(icx,icy,S.terrain);selectField(icx>>7,icy>>7,true);drawId=null;break;
    case"pick":   {const id=getCell(icx,icy);if(id){S.terrain=id;renderPalette();}drawId=null;break;}
    case"select": selectField(icx>>7,icy>>7);drawId=null;break;
  }
}
function abortDraw(){
  if(rectDrag)rectDrag=null;
  if(drawId!==null){endStroke();drawId=null;lastCell=null;pinDrag=null;}
  dirty=true;
}

cv.addEventListener("pointermove",e=>{
  const rec=ptrs.get(e.pointerId);
  if(rec){rec.x=e.offsetX;rec.y=e.offsetY;}
  hoverX=e.offsetX;hoverY=e.offsetY;hoverOn=true;dirty=true;

  if(pinch){
    const t=touchList();
    if(t.length>=2){
      const[a,b]=t;
      const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      if(pinch.d>0){
        const z=zs();
        S.cam.x-=(mx-pinch.mx)/z;S.cam.y-=(my-pinch.my)/z;
        setScale(S.scale*(d/pinch.d),mx,my);
      }
      pinch={d,mx,my};clampCam();
    }
    return;
  }
  if(panId===e.pointerId&&panPrev){
    const z=zs();
    S.cam.x-=(e.offsetX-panPrev.x)/z;S.cam.y-=(e.offsetY-panPrev.y)/z;
    panPrev={x:e.offsetX,y:e.offsetY};clampCam();return;
  }
  if(drawId!==e.pointerId)return;
  const[icx,icy]=cellOf(e);
  if(pinDrag){pinDrag.cx=clamp(icx,0,WX-1);pinDrag.cy=clamp(icy,0,WY-1);touchSave();return;}
  if(rectDrag){rectDrag.b=[clamp(icx,0,WX-1),clamp(icy,0,WY-1)];return;}
  const cur=[icx,icy];
  if(S.tool==="brush")   line(lastCell||cur,cur,S.terrain,false);
  if(S.tool==="scatter") line(lastCell||cur,cur,S.terrain,true);
  if(S.tool==="eraser")  line(lastCell||cur,cur,0,false);
  lastCell=cur;
});

function upPtr(e){
  ptrs.delete(e.pointerId);
  if(pinch&&touchList().length<2)pinch=null;
  if(panId===e.pointerId){panId=null;panPrev=null;cv.style.cursor=S.tool==="pan"?"grab":"crosshair";}
  if(drawId===e.pointerId){
    if(rectDrag){fillRect(rectDrag.a,rectDrag.b,S.terrain);rectDrag=null;}

  const m={b:"brush",r:"rect",g:"bucket",e:"eraser",s:"scatter",v:"select",p:"pin",i:"pick",h:"pan"};

function b64(u){let s="",C=0x8000;for(let i=0;i<u.length;i+=C)s+=String.fromCharCode.apply(null,u.subarray(i,i+C));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function serialize(){
  const fields={};
  for(const[k,f]of S.fields){
    let u=f[0],uni=true;
    for(let i=1;i<f.length;i++)if(f[i]!==u){uni=false;break;}
    if(uni){if(u!==0)fields[k]={u};}else fields[k]={d:b64(f)};
  }
  const meta={};
  for(const[k,m]of S.meta)if(m.nm||m.tags||m.notes||m.status!=="미착수")meta[k]=m;
  return{format:"darronoa-worldmap",version:1,
    grid:{fieldsX:FX,fieldsY:FY,cellsPerField:CPF,cmPerCell:CM,gamePxPerCell:GPX},
    palette:S.pal,fields,meta,pins:S.pins,pinSeq:S.pinSeq,savedAt:new Date().toISOString()};
}
function deserialize(o){
  if(!o||o.format!=="darronoa-worldmap")throw new Error("이 툴의 저장 파일이 아닙니다");
  S.pal=o.palette&&o.palette.length?o.palette:DEFAULT_PALETTE.map(p=>({...p}));
  rebuildPal();S.fields.clear();S.meta.clear();cache.clear();
  for(const k in o.fields||{}){
    const e=o.fields[k];
    if(e.u!=null){const f=new Uint8Array(CPF*CPF);f.fill(e.u);S.fields.set(k,f);}
    else if(e.d)S.fields.set(k,unb64(e.d));
  }
  for(const k in o.meta||{})S.meta.set(k,o.meta[k]);
  S.pins=o.pins||[];
  S.pinSeq=o.pinSeq||(S.pins.reduce((a,p)=>Math.max(a,p.id),0)+1);
  S.selField=null;S.selPin=null;S.iso=null;undoStack.length=0;
  if(S.terrain>=S.pal.length)S.terrain=1;
  renderPalette();renderInspector();dirty=true;
}

function exportPNG(y0,y1,label){
  const h=(y1-y0)*CPF;
  const c=document.createElement("canvas");c.width=WX;c.height=h;
  const x=c.getContext("2d");
  x.fillStyle="#000";x.fillRect(0,0,WX,h);x.imageSmoothingEnabled=false;
  for(const[k]of S.fields){
    const[fx,fy]=k.split(",").map(Number);
    if(fy<y0||fy>=y1)continue;
    const fc=fieldCanvas(fx,fy);
    if(fc)x.drawImage(fc,fx*CPF,(fy-y0)*CPF);
  }
  closeSheet();
  c.toBlob(b=>{
    if(!b){toast("이미지 생성 실패. 더 작은 구역으로 나눠보세요.");return;}
    download(b,`darronoa-terrain-${label}.png`);
    toast(`지형 마스크를 내려받았습니다 (${WX}×${h})`);
  },"image/png");
}
function closeSheet(){document.getElementById("sheet").classList.remove("on");}
document.getElementById("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
document.getElementById("btnPng").onclick=()=>{
  const parts=[[0,12],[12,24],[24,36],[36,48]];
  document.getElementById("sheetbox").innerHTML=
    `<h3>지형 마스크 PNG 내보내기</h3>
     <p>AI 생성이나 배경 작업의 구조 참조로 쓰는 이미지입니다. 아이패드에서는 전체 한 장(${WX}×${WY})이 캔버스 한계를 넘어 실패할 수 있어, 4구역으로 나눠 받는 쪽을 권합니다.</p>
     <div class="opt">
       ${parts.map(([a,b],i)=>`<button data-y0="${a}" data-y1="${b}">구역 ${i+1} · 필드 행 ${a}–${b-1}<small>${WX} × ${(b-a)*CPF}px · 약 ${((b-a)*CPF*WX/1e6).toFixed(1)}메가픽셀</small></button>`).join("")}
       <button data-y0="0" data-y1="48">전체 한 장<small>${WX} × ${WY}px · ${(WX*WY/1e6).toFixed(1)}메가픽셀 · 데스크톱 권장</small></button>
     </div><button class="close" id="shX">닫기</button>`;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("shX").onclick=closeSheet;
  document.querySelectorAll("#sheetbox .opt button").forEach(b=>b.onclick=()=>{
    const y0=+b.dataset.y0,y1=+b.dataset.y1;
    exportPNG(y0,y1,(y1-y0===48)?"full":`rows${y0}-${y1-1}`);
  });
};

let store=null;
try{localStorage.setItem("__t","1");localStorage.removeItem("__t");store="ls";}catch(e){}
let saveT=null;
function setSaveState(t,warn){
  const el=document.getElementById("savestate");
  el.textContent=t;el.classList.toggle("unsaved",!!warn);
}
function touchSave(){
  unsaved=true;
  if(!store){setSaveState("자동 저장 불가 · 저장 버튼을 쓰세요",true);return;}
  setSaveState("변경됨",true);
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{
      localStorage.setItem("darronoa-worldmap",JSON.stringify(serialize()));
      const d=new Date(),p=n=>String(n).padStart(2,"0");
      setSaveState(`자동 저장 ${p(d.getHours())}:${p(d.getMinutes())}`);
      unsaved=false;
    }catch(e){store=null;setSaveState("용량 초과 · 파일로 저장하세요",true);}
  },1500);
}
function restore(){
  if(!store){setSaveState("자동 저장 불가 · 저장 버튼을 쓰세요",true);return;}
  try{
    const raw=localStorage.getItem("darronoa-worldmap");
    if(raw){deserialize(JSON.parse(raw));setSaveState("이전 작업 복원");}
    else setSaveState("자동 저장 켜짐");
  }catch(e){setSaveState("자동 저장 켜짐");}
}
window.addEventListener("beforeunload",e=>{if(unsaved){e.preventDefault();e.returnValue="";}});

let toastT=null;
function toast(m){
  const el=document.getElementById("toast");
  el.textContent=m;el.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2600);
}

renderTools();renderZoom();renderPalette();syncBrush();
resize();restore();renderInspector();clampCam();
requestAnimationFrame(loop);
if(window.matchMedia("(pointer:coarse)").matches)
  setTimeout(()=>toast("펜슬로 그리고, 손가락으로 밀거나 두 손가락으로 확대하세요"),700);
</script>
