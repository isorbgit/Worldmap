<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>다로노아 월드맵 기획 툴</title>
<style>
:root{
  --bg:#14171c; --panel:#1c2027; --panel-2:#232830;
  --line:#2e343d; --line-soft:#262b33;
  --txt:#dde2e9; --txt-dim:#8b95a3; --txt-faint:#5d6673;
  --accent:#9d7cd8; --accent-soft:#6b4fa0;
  --fac:#d8a24a; --fac-soft:#8a6220;
  --warn:#d97a5c; --ok:#6fae7a;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--txt);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
body.faclayer{--accent:var(--fac);--accent-soft:var(--fac-soft)}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:none;cursor:pointer;touch-action:manipulation}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#343b45;border-radius:5px}

#app{display:flex;flex-direction:column;height:100%}

#topbar{display:flex;align-items:center;gap:8px;height:48px;padding:0 10px;flex:0 0 auto;
  background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
#topbar::-webkit-scrollbar{display:none}
#brand{display:flex;flex-direction:column;line-height:1.2;padding-right:4px;flex:0 0 auto}
#brand b{font-size:13.5px;font-weight:600}
#brand span{font-size:10px;color:var(--txt-faint)}

#layerrow{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:9px;flex:0 0 auto}
.lbtn{padding:6px 12px;border-radius:6px;font-size:12px;color:var(--txt-dim);font-weight:500}
.lbtn.on{background:var(--accent-soft);color:#fff}
.lbtn[data-l="faction"].on{background:var(--fac-soft);color:#fff}

.zoomrow{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:9px;flex:0 0 auto}
.zbtn{padding:5px 9px;border-radius:6px;font-size:10.5px;color:var(--txt-dim);
  display:flex;flex-direction:column;align-items:center;line-height:1.25;min-width:48px}
.zbtn b{font-size:12px;font-weight:600}
.zbtn.on{background:var(--accent-soft);color:#fff}
.zbtn.on b{color:#fff}
.spacer{flex:1;min-width:4px}
.tbtn{padding:8px 11px;border-radius:8px;border:1px solid var(--line);color:var(--txt-dim);
  background:var(--panel-2);font-size:12px;white-space:nowrap;flex:0 0 auto}
.tbtn.pri{background:var(--accent-soft);border-color:var(--accent-soft);color:#fff}
.tbtn.busy{opacity:.5;pointer-events:none}
#savestate{font-size:10.5px;color:var(--txt-faint);white-space:nowrap;flex:0 0 auto;
  max-width:160px;text-align:right;line-height:1.3}
#savestate.unsaved{color:var(--warn)}

#body{display:flex;flex:1;min-height:0;position:relative}

#rail{width:128px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.sect{padding:9px 9px 11px;border-bottom:1px solid var(--line-soft)}
.sect h3{font-size:10.5px;font-weight:500;color:var(--txt-faint);margin-bottom:6px}
.toolbtn{display:flex;align-items:center;gap:7px;width:100%;padding:8px;border-radius:7px;
  color:var(--txt-dim);font-size:12px;text-align:left}
.toolbtn .k{margin-left:auto;font-size:9.5px;color:var(--txt-faint)}
.toolbtn.on{background:var(--accent-soft);color:#fff}
.toolbtn.on .k{color:rgba(255,255,255,.7)}
.toolbtn svg{width:15px;height:15px;flex:0 0 auto}
.slab{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-dim);margin:8px 0 2px}
.slab i{color:var(--txt);font-style:normal}
input[type=range]{width:100%;accent-color:var(--accent);height:26px}
.chk{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--txt-dim);padding:5px 0;cursor:pointer}
.chk input{accent-color:var(--accent);margin:0;width:16px;height:16px;flex:0 0 auto}
.warnbox{background:#2b2318;border:1px solid var(--fac-soft);border-radius:7px;
  padding:7px;font-size:10.5px;color:#e0c48a;line-height:1.5;margin-bottom:8px}

#stage{flex:1;position:relative;min-width:0;background:#0f1216;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#mini{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;padding:5px;box-shadow:0 8px 26px rgba(0,0,0,.5);touch-action:none}
#minicv{display:block;border-radius:3px}
#hud{position:absolute;right:10px;top:10px;display:flex;gap:5px;flex-wrap:wrap;
  justify-content:flex-end;pointer-events:none;max-width:70%}
.chip{background:rgba(20,23,28,.9);border:1px solid var(--line);border-radius:7px;
  padding:4px 8px;font-size:10.5px;color:var(--txt-dim);backdrop-filter:blur(6px)}
.chip b{color:var(--txt);font-weight:600}
#zoombtns{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:5px}
#zoombtns button{width:44px;height:44px;border-radius:11px;background:rgba(28,32,39,.94);
  border:1px solid var(--line);color:var(--txt-dim);font-size:19px;
  box-shadow:0 4px 16px rgba(0,0,0,.4);backdrop-filter:blur(6px)}
#zoombtns button:active{background:var(--accent-soft);color:#fff}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:9px 15px;font-size:12px;
  box-shadow:0 8px 26px rgba(0,0,0,.5);opacity:0;transition:opacity .18s;pointer-events:none;
  max-width:78%;text-align:center}
#toast.show{opacity:1}

#insp{width:302px;flex:0 0 auto;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
#insphd{padding:9px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;display:flex;align-items:center;gap:8px}
#insphd h2{font-size:13px;font-weight:600}
#insphd .sub{font-size:11px;color:var(--txt-faint);margin-left:auto}
#inspclose{display:none;color:var(--txt-dim);font-size:18px;padding:0 4px}
#inspbody{flex:1;overflow-y:auto;padding:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.empty{color:var(--txt-faint);font-size:12px;line-height:1.7;padding:6px 2px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;color:var(--txt-faint);margin-bottom:4px}
.fld input[type=text],.fld textarea,.fld select{width:100%;background:var(--panel-2);
  border:1px solid var(--line);border-radius:7px;padding:9px;font-size:16px}
.fld textarea{resize:vertical;min-height:92px;line-height:1.6;font-size:15px}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent-soft)}
.navrow{display:flex;align-items:center;gap:5px;margin-bottom:10px}
.navrow .coord{flex:1;text-align:center;background:var(--panel-2);border-radius:7px;padding:7px;
  font-size:13px;font-weight:600}
.navrow .coord small{display:block;font-size:10px;font-weight:400;color:var(--txt-faint)}
.nb{width:38px;height:40px;border-radius:8px;background:var(--panel-2);color:var(--txt-dim);font-size:15px}
.crow{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px}
.sw{width:12px;height:12px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(0,0,0,.4)}
.crow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .pc{color:var(--txt-dim);font-size:11px}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;display:flex;margin:5px 0 9px}
.bar div{height:100%}
.actrow{display:flex;gap:6px;margin-bottom:10px}
.actrow button{flex:1;padding:10px 6px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--txt-dim);font-size:11.5px}
hr.sep{border:none;border-top:1px solid var(--line-soft);margin:13px 0}

#palwrap{padding:11px;border-top:1px solid var(--line);flex:0 0 auto;max-height:46%;
  overflow-y:auto;overscroll-behavior:contain}
#palwrap h3{font-size:10.5px;color:var(--txt-faint);margin-bottom:7px;display:flex;align-items:center;gap:6px}
#palwrap h3 button{margin-left:auto;color:var(--txt-dim);font-size:11px;padding:3px 6px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pitem{display:flex;align-items:center;gap:6px;padding:8px 6px;border-radius:7px;font-size:11.5px;
  color:var(--txt-dim);cursor:pointer;border:1px solid transparent;text-align:left}
.pitem.on{border-color:var(--accent);background:rgba(157,124,216,.16);color:#fff}
body.faclayer .pitem.on{border-color:var(--fac);background:rgba(216,162,74,.16)}
.pitem .sw{width:13px;height:13px}
.pitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pitem .blk{font-size:9px;color:var(--warn)}
.pitem .ed{color:var(--txt-faint);font-size:12px;padding:0 3px}
.paledit{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px}
.paledit .r{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.paledit input[type=text]{flex:1;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:8px;font-size:16px}
.paledit input[type=color]{width:38px;height:36px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.paledit .btns{display:flex;gap:6px}
.paledit .btns button{flex:1;padding:9px;border-radius:6px;font-size:11.5px;background:var(--bg);
  border:1px solid var(--line);color:var(--txt-dim)}
.paledit .btns button.pri{background:var(--accent-soft);border-color:var(--accent-soft);color:#fff}
.paledit .btns button.del{color:var(--warn)}

.pinlist{display:flex;flex-direction:column;gap:3px;margin-bottom:11px}
.pinrow{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;
  cursor:pointer;border:1px solid transparent;text-align:left;width:100%}
.pinrow.on{border-color:var(--accent);background:rgba(157,124,216,.16)}
body.faclayer .pinrow.on{border-color:var(--fac);background:rgba(216,162,74,.16)}
.pinrow .ic{font-size:15px;width:20px;text-align:center;flex:0 0 auto}
.pinrow .tt{flex:1;min-width:0;overflow:hidden}
.pinrow .tt b{display:block;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinrow .tt small{color:var(--txt-faint);font-size:10.5px}
.kindgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.kindgrid button{padding:8px 2px;border-radius:8px;background:var(--panel-2);
  border:1px solid transparent;font-size:15px;color:var(--txt-dim);line-height:1.2}
.kindgrid button small{display:block;font-size:9.5px;margin-top:2px}
.kindgrid button.on{border-color:var(--accent);background:rgba(157,124,216,.16);color:#fff}
body.faclayer .kindgrid button.on{border-color:var(--fac);background:rgba(216,162,74,.16)}

#sheet{position:fixed;inset:0;background:rgba(8,10,13,.72);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px}
#sheet.on{display:flex}
#sheetbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px;width:min(460px,100%);max-height:86vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#sheetbox h3{font-size:14px;margin-bottom:4px}
#sheetbox p{font-size:12px;color:var(--txt-dim);margin-bottom:14px;line-height:1.65}
#sheetbox .opt{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
#sheetbox .opt button{padding:12px;border-radius:9px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--txt);font-size:12.5px;text-align:left;width:100%}
#sheetbox .opt button small{display:block;color:var(--txt-faint);font-size:10.5px;margin-top:2px}
#sheetbox .close{width:100%;padding:11px;border-radius:9px;background:none;
  border:1px solid var(--line);color:var(--txt-dim);font-size:12px}
table.st{width:100%;font-size:11.5px;border-collapse:collapse;margin-bottom:14px}
table.st th{text-align:left;color:var(--txt-faint);font-weight:500;font-size:10.5px;
  padding:4px 5px;border-bottom:1px solid var(--line)}
table.st td{padding:5px;border-bottom:1px solid var(--line-soft)}
table.st td.n{text-align:right;color:var(--txt-dim)}

#inspToggle{display:none}
@media (max-width:1150px){
  #rail{width:62px}
  #rail .sect h3{display:none}
  #rail .warnbox{font-size:9px;padding:5px}
  .toolbtn{justify-content:center;padding:11px 4px;font-size:0;gap:0}
  .toolbtn .k{display:none}
  .toolbtn span:not(.k){display:none}
  .toolbtn svg{width:19px;height:19px}
  .chk{font-size:9.5px;flex-direction:column;gap:3px;text-align:center;padding:6px 0}
  .slab{font-size:9.5px;flex-direction:column;gap:0;text-align:center}
  .lbtn{padding:6px 9px;font-size:11px}
  #insp{position:absolute;right:0;top:0;bottom:0;z-index:30;width:320px;
    transform:translateX(101%);transition:transform .22s ease;box-shadow:-14px 0 40px rgba(0,0,0,.5)}
  #insp.open{transform:none}
  #inspclose{display:block}
  #inspToggle{display:block}
  #brand span{display:none}
}
@media (max-width:700px){
  #insp{width:100%}
  #brand{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="brand"><b>다로노아 월드맵</b><span>32 × 48 필드 · 1,966m × 2,949m</span></div>
    <div id="layerrow">
      <button class="lbtn on" data-l="terrain">지형</button>
      <button class="lbtn" data-l="faction">세력</button>
    </div>
    <div class="zoomrow" id="zoomrow"></div>
    <div class="spacer"></div>
    <button class="tbtn" id="btnStats">통계</button>
    <button class="tbtn" id="btnCheck">연결성</button>
    <button class="tbtn" id="btnPng">PNG</button>
    <button class="tbtn" id="btnLoad">열기</button>
    <button class="tbtn pri" id="btnSave">저장</button>
    <button class="tbtn" id="inspToggle">패널</button>
    <span id="savestate"></span>
  </div>

  <div id="body">
    <div id="rail">
      <div class="sect" id="lockNote" style="display:none">
        <div class="warnbox">세력 레이어 편집 중 — 지형은 잠겨 있습니다</div>
      </div>
      <div class="sect"><h3>도구</h3><div id="tools"></div></div>
      <div class="sect">
        <div class="slab">붓 <i id="bsv">16셀</i></div>
        <input type="range" id="bs" min="0" max="6" step="1" value="4">
        <div class="slab" id="denlab" style="display:none">밀도 <i id="denv">35%</i></div>
        <input type="range" id="den" min="5" max="100" step="5" value="35" style="display:none">
        <label class="chk" id="contestWrap" style="display:none" title="분쟁 주장으로 칠하기"><input type="checkbox" id="cContest"><span>분쟁칠</span></label>
      </div>
      <div class="sect">
        <h3>표시</h3>
        <label class="chk" title="세력 레이어 표시"><input type="checkbox" id="cFac"><span>세력</span></label>
        <div class="slab" id="faclab" style="display:none">진하기 <i id="facav">55%</i></div>
        <input type="range" id="faca" min="15" max="100" step="5" value="55" style="display:none">
        <label class="chk" title="필드 격자"><input type="checkbox" id="cGrid" checked><span>격자</span></label>
        <label class="chk" title="필드 좌표"><input type="checkbox" id="cLabel" checked><span>좌표</span></label>
        <label class="chk" title="로어 핀 항상 보기"><input type="checkbox" id="cPins"><span>핀</span></label>
        <label class="chk" title="통행 불가 강조"><input type="checkbox" id="cBlock"><span>벽</span></label>
        <label class="chk" title="고립 구역"><input type="checkbox" id="cIso" checked><span>고립</span></label>
      </div>
      <div class="sect">
        <h3>입력</h3>
        <label class="chk" title="손가락으로도 그리기"><input type="checkbox" id="cFinger"><span>손그리기</span></label>
        <div class="slab" title="펜 좌우 보정">보정 X <i id="poxv">0</i></div>
        <input type="range" id="pox" min="-24" max="24" step="1" value="0">
        <div class="slab" title="펜 상하 보정">보정 Y <i id="poyv">0</i></div>
        <input type="range" id="poy" min="-24" max="24" step="1" value="0">
        <button class="toolbtn" id="btnPenReset" title="보정 초기화" style="justify-content:center"><span>보정 초기화</span></button>
      </div>
      <div class="sect">
        <h3>편집</h3>
        <button class="toolbtn" id="btnUndo" title="되돌리기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></svg><span>되돌리기</span></button>
        <button class="toolbtn" id="btnAuto" title="거점에서 세력 범위 생성" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span>범위 자동 생성</span></button>
        <button class="toolbtn" id="btnReset" title="현재 레이어 비우기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg><span>레이어 비우기</span></button>
      </div>
    </div>

    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="hud"></div>
      <div id="mini"><canvas id="minicv"></canvas></div>
      <div id="zoombtns"><button id="zIn">＋</button><button id="zOut">－</button></div>
      <div id="toast"></div>
    </div>

    <div id="insp">
      <div id="insphd"><h2 id="inspttl">인스펙터</h2><span class="sub" id="inspsub"></span><button id="inspclose">✕</button></div>
      <div id="inspbody"></div>
      <div id="palwrap">
        <h3><span id="palttl">지형</span> <button id="btnAddT">+ 추가</button></h3>
        <div id="paledithost"></div>
        <div class="pal" id="pal"></div>
      </div>
    </div>
  </div>
</div>

<div id="sheet"><div id="sheetbox"></div></div>
<input type="file" id="fileIn" accept=".json,application/json" style="display:none">

<script>
"use strict";
/* ═══ 다로노아 월드맵 기획 툴 ═══
   필드 2048게임px = 128셀 → 1셀 = 16게임px = 48cm
   레이어: 지형 / 세력(1차 주장 + 분쟁 주장) + 거점 + 로어 핀
   펜슬 = 그리기 / 손가락 = 이동·핀치줌
   ═══════════════════════════════ */

const CPF=128, FX=32, FY=48;
const WX=FX*CPF, WY=FY*CPF;
const CM=48, GPX=16;
const MINS=1/8, MAXS=16;
const CELL_M2=(CM/100)*(CM/100);

const ZOOMS=[
  {s:1/8,n:"Z0",t:"세계"},{s:1/4,n:"Z1",t:"지방"},
  {s:1,n:"Z2",t:"지역"},{s:4,n:"Z3",t:"근접"},{s:16,n:"Z4",t:"상세"},
];
const PIN_SCALE_MAX=0.5;
const BRUSH_SIZES=[1,2,4,8,16,32,64];

const fk=(a,b)=>a+","+b;

function hexRGB(h){h=String(h||"#000").replace("#","");if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n=parseInt(h,16)||0;return[(n>>16)&255,(n>>8)&255,n&255];}

/* 현재 편집 대상 맵 */
function target(){
  if(!isFac())return{m:S.fields,pfx:"T",c:cache};
  return S.contestMode?{m:S.contest,pfx:"C",c:facCache}:{m:S.claim,pfx:"F",c:facCache};
}
function mapOf(pfx){return pfx==="T"?S.fields:pfx==="F"?S.claim:S.contest;}

function getFieldIn(m,fx,fy,create){
  const k=fk(fx,fy);let f=m.get(k);
  if(!f&&create){f=new Uint8Array(CPF*CPF);m.set(k,f);}return f;
}
function cellIn(m,cx,cy){
  if(cx<0||cy<0||cx>=WX||cy>=WY)return 0;
  const f=m.get(fk(cx>>7,cy>>7));return f?f[(cy&127)*CPF+(cx&127)]:0;
}
function getMeta(fx,fy,c){const k=fk(fx,fy);let m=S.meta.get(k);
  if(!m&&c){m={nm:"",tags:"",notes:"",status:"미착수"};S.meta.set(k,m);}return m;}

/* 현재 레이어 기준 읽기/쓰기 */
function getCell(cx,cy){return cellIn(target().m,cx,cy);}
function setCell(cx,cy,v){
  if(cx<0||cy<0||cx>=WX||cy>=WY)return false;
  const t=target(),fx=cx>>7,fy=cy>>7;
  const f=getFieldIn(t.m,fx,fy,true),i=(cy&127)*CPF+(cx&127);
  if(f[i]===v)return false;
  f[i]=v;t.c.delete(fk(fx,fy));
  if(t.pfx!=="T")facCache.delete(fk(fx,fy));
  return true;
}

/* ── 되돌리기 (레이어 구분) ── */
let snap=null;
function beginStroke(){snap=new Map();}
function snapField(fx,fy){
  if(!snap)return;
  const t=target(),k=t.pfx+":"+fk(fx,fy);
  if(snap.has(k))return;
  const f=t.m.get(fk(fx,fy));snap.set(k,f?f.slice():null);
}
function endStroke(){if(!snap||!snap.size){snap=null;return;}
  undoStack.push(snap);if(undoStack.length>30)undoStack.shift();snap=null;touchSave();}
function undo(){
  const s=undoStack.pop();
  if(!s){toast("되돌릴 작업이 없습니다");return;}
  for(const[key,a]of s){
    const pfx=key[0],k=key.slice(2),m=mapOf(pfx);
    if(a===null)m.delete(k);else m.set(k,a);
    if(pfx==="T")cache.delete(k);else facCache.delete(k);
  }
  S.iso=null;dirty=true;renderInspector();touchSave();
}

const zs=()=>S.scale;
function s2c(px,py){const z=zs();return[S.cam.x+(px-VW/2)/z,S.cam.y+(py-VH/2)/z];}
function c2s(cx,cy){const z=zs();return[(cx-S.cam.x)*z+VW/2,(cy-S.cam.y)*z+VH/2];}
function clampCam(){const z=zs(),hw=VW/2/z,hh=VH/2/z;
  S.cam.x=WX<=hw*2?WX/2:clamp(S.cam.x,hw,WX-hw);
  S.cam.y=WY<=hh*2?WY/2:clamp(S.cam.y,hh,WY-hh);}
function levelIdx(){let b=0,bd=1e9;
  for(let i=0;i<ZOOMS.length;i++){const d=Math.abs(Math.log2(S.scale/ZOOMS[i].s));if(d<bd){bd=d;b=i;}}
  return b;}
const wideMode=()=>S.scale<=PIN_SCALE_MAX;
function setScale(ns,ax,ay){
  ns=clamp(ns,MINS,MAXS);
  if(Math.abs(ns-S.scale)<1e-9)return;
  if(ax===undefined){ax=VW/2;ay=VH/2;}
  const[bx,by]=s2c(ax,ay);
  const was=wideMode();S.scale=ns;
  S.cam.x=bx-(ax-VW/2)/ns;S.cam.y=by-(ay-VH/2)/ns;
  clampCam();renderZoom();dirty=true;
  if(was!==wideMode())renderInspector();
}

/* ── 비트맵 캐시 ── */
let palRGB=[],facRGB=[];
function rebuildPal(){palRGB=S.pal.map(p=>hexRGB(p.c));facRGB=S.fac.map(p=>hexRGB(p.c));}
rebuildPal();

function fieldCanvas(fx,fy){
  const k=fk(fx,fy);let c=cache.get(k);if(c)return c;
  const f=S.fields.get(k);if(!f)return null;
  c=document.createElement("canvas");c.width=CPF;c.height=CPF;
  const x=c.getContext("2d"),img=x.createImageData(CPF,CPF),d=img.data,blk=S.show.block;
  for(let i=0;i<f.length;i++){
    const id=f[i],o=i*4;
    if(!id){d[o+3]=0;continue;}
    const g=palRGB[id]||[255,0,255];let r=g[0],gg=g[1],b=g[2];
    if(blk&&S.pal[id]&&!S.pal[id].walk){r=(r+230)>>1;gg=(gg+90)>>1;b=(b+70)>>1;}
    d[o]=r;d[o+1]=gg;d[o+2]=b;d[o+3]=255;
  }
  x.putImageData(img,0,0);cache.set(k,c);return c;
}

/* 세력 비트맵: 1차 주장 색 + 분쟁 셀은 사선 띠로 2차 주장 색을 교차 */
function facCanvas(fx,fy){
  const k=fk(fx,fy);let c=facCache.get(k);if(c)return c;
  const A=S.claim.get(k),B=S.contest.get(k);
  if(!A&&!B)return null;
  c=document.createElement("canvas");c.width=CPF;c.height=CPF;
  const x=c.getContext("2d"),img=x.createImageData(CPF,CPF),d=img.data;
  for(let y=0;y<CPF;y++)for(let px=0;px<CPF;px++){
    const i=y*CPF+px,o=i*4;
    const a=A?A[i]:0, b=B?B[i]:0;
    let id=a;
    if(b && (((px+y)>>2)&1)) id=b;      // 4셀 폭 사선 띠
    if(!id){d[o+3]=0;continue;}
    const g=facRGB[id]||[255,0,255];
    d[o]=g[0];d[o+1]=g[1];d[o+2]=g[2];d[o+3]=255;
  }
  x.putImageData(img,0,0);facCache.set(k,c);return c;
}

/* ── 연결성 검사 ── */
const IR=4,IW=WX/IR,IH=WY/IR;
function checkConnectivity(){
  const walk=new Uint8Array(IW*IH);let total=0;
  for(const[k,f]of S.fields){
    const[fx,fy]=k.split(",").map(Number),bx=fx*CPF/IR,by=fy*CPF/IR,n=CPF/IR;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++){
      let w=0;
      for(let dy=0;dy<IR;dy++)for(let dx=0;dx<IR;dx++){
        const id=f[(y*IR+dy)*CPF+x*IR+dx];
        if(id&&S.pal[id]&&S.pal[id].walk)w++;
      }
      if(w>IR*IR/2){walk[(by+y)*IW+bx+x]=1;total++;}
    }
  }
  if(!total){S.iso=null;dirty=true;toast("검사할 통행 가능 지형이 없습니다");return;}
  const lab=new Int32Array(IW*IH).fill(-1),q=new Int32Array(total+8),sizes=[];
  for(let st=0;st<walk.length;st++){
    if(!walk[st]||lab[st]>=0)continue;
    const id=sizes.length;let h=0,t=0,c=0;q[t++]=st;lab[st]=id;
    while(h<t){
      const p=q[h++];c++;const x=p%IW,y=(p-x)/IW;
      if(x>0){const n=p-1;if(walk[n]&&lab[n]<0){lab[n]=id;q[t++]=n;}}
      if(x<IW-1){const n=p+1;if(walk[n]&&lab[n]<0){lab[n]=id;q[t++]=n;}}
      if(y>0){const n=p-IW;if(walk[n]&&lab[n]<0){lab[n]=id;q[t++]=n;}}
      if(y<IH-1){const n=p+IW;if(walk[n]&&lab[n]<0){lab[n]=id;q[t++]=n;}}
    }
    sizes.push(c);
  }
  let main=0;for(let i=1;i<sizes.length;i++)if(sizes[i]>sizes[main])main=i;
  const iso=new Uint8Array(IW*IH);let n=0;
  for(let i=0;i<lab.length;i++)if(lab[i]>=0&&lab[i]!==main){iso[i]=1;n++;}
  S.iso=n?iso:null;
  document.getElementById("cIso").checked=true;S.show.iso=true;dirty=true;
  const cnt=sizes.length-1,area=(n*IR*IR*CELL_M2).toFixed(0);
  toast(cnt===0?"고립 구역 없음. 전체가 하나로 이어져 있습니다."
               :`고립 구역 ${cnt}개 · 총 ${Number(area).toLocaleString()}㎡ — 붉게 표시했습니다`);
}

/* ── 거점에서 세력 범위 자동 생성 ──
   통행 가능한 지형만, 각 거점의 영향 반경 안에서 가중 거리가 가장 가까운 거점에 귀속 */
function autoTerritory(){
  if(!S.holds.length){toast("거점을 먼저 배치하세요");return;}
  const best=new Float32Array(IW*IH).fill(Infinity);
  const own=new Uint8Array(IW*IH);
  for(const h of S.holds){
    if(!h.fac)continue;
    const ht=HOLD_TYPES.find(t=>t.id===h.type)||HOLD_TYPES[0];
    const r=(h.r||ht.r)/IR;
    const hx=h.cx/IR, hy=h.cy/IR;
    const x0=Math.max(0,Math.floor(hx-r)),x1=Math.min(IW-1,Math.ceil(hx+r));
    const y0=Math.max(0,Math.floor(hy-r)),y1=Math.min(IH-1,Math.ceil(hy+r));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      const dx=x-hx,dy=y-hy,d=Math.sqrt(dx*dx+dy*dy);
      if(d>r)continue;
      const score=d/r;
      const i=y*IW+x;
      if(score<best[i]){best[i]=score;own[i]=h.fac;}
    }
  }
  const before=new Map();
  let filled=0;
  for(let y=0;y<IH;y++)for(let x=0;x<IW;x++){
    const i=y*IW+x,f=own[i];
    if(!f)continue;
    const cx=x*IR,cy=y*IR;
    const tid=cellIn(S.fields,cx,cy);
    if(!tid||!S.pal[tid]||!S.pal[tid].walk)continue;
    const fx=cx>>7,fy=cy>>7,key=fk(fx,fy);
    if(!before.has(key)){const e=S.claim.get(key);before.set(key,e?e.slice():null);}
    const arr=getFieldIn(S.claim,fx,fy,true);
    for(let dy=0;dy<IR;dy++)for(let dx=0;dx<IR;dx++){
      const lx=(cx+dx)&127, ly=(cy+dy)&127;
      arr[ly*CPF+lx]=f;
    }
    facCache.delete(key);filled++;
  }
  if(!filled){toast("귀속된 영역이 없습니다. 거점 주변 지형이 칠해져 있는지 확인하세요");return;}
  const s=new Map();
  for(const[k,v]of before)s.set("F:"+k,v);
  undoStack.push(s);if(undoStack.length>30)undoStack.shift();
  document.getElementById("cFac").checked=true;S.show.fac=true;
  dirty=true;renderInspector();touchSave();
  toast(`세력 범위를 생성했습니다 · 약 ${(filled*IR*IR*CELL_M2/1000).toFixed(0)}천㎡ — 되돌리기로 취소 가능`);
}

/* ── 그리기 ── */
function holdShape(x,y,s,shape){
  const p=ctx;p.beginPath();
  switch(shape){
    case"circle": p.arc(x,y,s,0,7);break;
    case"sq": case"sq-s": p.rect(x-s,y-s,s*2,s*2);break;
    case"tri": case"tri-s":
      p.moveTo(x,y-s);p.lineTo(x+s,y+s*0.8);p.lineTo(x-s,y+s*0.8);p.closePath();break;
    case"diamond":
      p.moveTo(x,y-s);p.lineTo(x+s,y);p.lineTo(x,y+s);p.lineTo(x-s,y);p.closePath();break;
    case"star":
      for(let i=0;i<10;i++){
        const a=-Math.PI/2+i*Math.PI/5, rr=i%2?s*0.46:s;
        const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
        i?p.lineTo(px,py):p.moveTo(px,py);
      }
      p.closePath();break;
    default: p.arc(x,y,s,0,7);
  }
}

function draw(){
  const z=zs();
  ctx.clearRect(0,0,VW,VH);
  const[ox,oy]=c2s(0,0),[ex,ey]=c2s(WX,WY);
  ctx.fillStyle="#171b21";ctx.fillRect(ox,oy,ex-ox,ey-oy);

  const[c0x,c0y]=s2c(0,0),[c1x,c1y]=s2c(VW,VH);
  const f0x=clamp(Math.floor(c0x/CPF),0,FX-1),f1x=clamp(Math.floor(c1x/CPF),0,FX-1);
  const f0y=clamp(Math.floor(c0y/CPF),0,FY-1),f1y=clamp(Math.floor(c1y/CPF),0,FY-1);
  const fpx=CPF*z;

  ctx.imageSmoothingEnabled=z<1;
  for(let fy=f0y;fy<=f1y;fy++)for(let fx=f0x;fx<=f1x;fx++){
    const c=fieldCanvas(fx,fy);if(!c)continue;
    const[sx,sy]=c2s(fx*CPF,fy*CPF);
    ctx.drawImage(c,sx,sy,fpx,fpx);
  }

  // 세력 레이어를 보일 때는 지형을 뒤로 물리고 세력색을 얹는다
  if(S.show.fac){
    ctx.fillStyle=isFac()?"rgba(18,21,26,.62)":"rgba(18,21,26,.38)";
    ctx.fillRect(Math.max(0,ox),Math.max(0,oy),
      Math.min(VW,ex)-Math.max(0,ox),Math.min(VH,ey)-Math.max(0,oy));
    ctx.save();ctx.globalAlpha=S.facAlpha;
    for(let fy=f0y;fy<=f1y;fy++)for(let fx=f0x;fx<=f1x;fx++){
      const c=facCanvas(fx,fy);if(!c)continue;
      const[sx,sy]=c2s(fx*CPF,fy*CPF);
      ctx.drawImage(c,sx,sy,fpx,fpx);
    }
    ctx.restore();
  }
  ctx.imageSmoothingEnabled=false;

  if(S.iso&&S.show.iso){
    ctx.save();ctx.fillStyle="#e2503f";
    ctx.globalAlpha=.35+.2*Math.sin(Date.now()/333);
    const ip=IR*z;
    const i0x=clamp(Math.floor(c0x/IR),0,IW-1),i1x=clamp(Math.ceil(c1x/IR),0,IW-1);
    const i0y=clamp(Math.floor(c0y/IR),0,IH-1),i1y=clamp(Math.ceil(c1y/IR),0,IH-1);
    for(let y=i0y;y<=i1y;y++)for(let x=i0x;x<=i1x;x++){
      if(!S.iso[y*IW+x])continue;
      const[sx,sy]=c2s(x*IR,y*IR);
      ctx.fillRect(sx,sy,Math.max(1,ip),Math.max(1,ip));
    }
    ctx.restore();dirty=true;
  }

  if(z>=4&&S.show.grid){
    ctx.strokeStyle="rgba(255,255,255,.05)";ctx.lineWidth=1;ctx.beginPath();
    for(let cx=Math.ceil(c0x);cx<=c1x;cx++){const[sx]=c2s(cx,0);ctx.moveTo(sx+.5,0);ctx.lineTo(sx+.5,VH);}
    for(let cy=Math.ceil(c0y);cy<=c1y;cy++){const[,sy]=c2s(0,cy);ctx.moveTo(0,sy+.5);ctx.lineTo(VW,sy+.5);}
    ctx.stroke();
  }
  if(S.show.grid){
    ctx.strokeStyle=z>=1?"rgba(255,255,255,.14)":"rgba(255,255,255,.09)";
    ctx.lineWidth=1;ctx.beginPath();
    for(let fx=f0x;fx<=f1x+1;fx++){const[sx]=c2s(fx*CPF,0);ctx.moveTo(sx+.5,Math.max(0,oy));ctx.lineTo(sx+.5,Math.min(VH,ey));}
    for(let fy=f0y;fy<=f1y+1;fy++){const[,sy]=c2s(0,fy*CPF);ctx.moveTo(Math.max(0,ox),sy+.5);ctx.lineTo(Math.min(VW,ex),sy+.5);}
    ctx.stroke();
  }
  if(S.show.label&&fpx>=46){
    ctx.textBaseline="top";
    for(let fy=f0y;fy<=f1y;fy++)for(let fx=f0x;fx<=f1x;fx++){
      const[sx,sy]=c2s(fx*CPF,fy*CPF),m=S.meta.get(fk(fx,fy));
      ctx.font="500 10px ui-monospace,Menlo,monospace";
      ctx.fillStyle="rgba(255,255,255,.3)";ctx.fillText(fx+","+fy,sx+4,sy+3);
      if(m&&m.nm&&fpx>=90){
        ctx.font="600 11px -apple-system,sans-serif";
        ctx.fillStyle="rgba(255,255,255,.72)";ctx.fillText(m.nm,sx+4,sy+16);
      }
    }
    ctx.textBaseline="alphabetic";
  }
  if(S.selField&&!wideMode()){
    const[sx,sy]=c2s(S.selField[0]*CPF,S.selField[1]*CPF);
    ctx.strokeStyle=isFac()?"#d8a24a":"#9d7cd8";ctx.lineWidth=2;
    ctx.strokeRect(sx+1,sy+1,fpx-2,fpx-2);
  }

  // 거점 — 세력 레이어이거나 세력 표시가 켜져 있을 때
  if(isFac()||S.show.fac){
    for(const h of S.holds){
      const[sx,sy]=c2s(h.cx,h.cy);
      if(sx<-40||sy<-40||sx>VW+40||sy>VH+40)continue;
      const ht=HOLD_TYPES.find(t=>t.id===h.type)||HOLD_TYPES[0];
      const on=S.selHold===h.id;
      const base=/-s$/.test(ht.shape)?7:10;
      const s=(on?base+3:base)*(z<0.2?0.8:1);
      ctx.save();
      ctx.lineWidth=on?2.5:1.8;
      ctx.strokeStyle=on?"#fff":"rgba(12,14,18,.9)";
      ctx.fillStyle=(S.fac[h.fac]&&S.fac[h.fac].c)||"#888";
      holdShape(sx,sy,s,ht.shape);ctx.fill();ctx.stroke();
      ctx.restore();
      if(h.nm&&(on||z>=1/4)){
        ctx.font="600 11px -apple-system,sans-serif";ctx.textAlign="center";ctx.textBaseline="top";
        const w=ctx.measureText(h.nm).width;
        ctx.fillStyle="rgba(20,23,28,.88)";ctx.fillRect(sx-w/2-5,sy+s+4,w+10,16);
        ctx.fillStyle=on?"#fff":"rgba(255,255,255,.85)";ctx.fillText(h.nm,sx,sy+s+6);
        ctx.textAlign="left";ctx.textBaseline="alphabetic";
      }
    }
  }

  // 로어 핀
  if((!isFac()&&wideMode())||S.show.pins){
    for(const p of S.pins){
      const[sx,sy]=c2s(p.cx,p.cy);
      if(sx<-40||sy<-40||sx>VW+40||sy>VH+40)continue;
      const on=S.selPin===p.id,r=on?16:14;
      ctx.beginPath();ctx.arc(sx,sy,r,0,7);
      ctx.fillStyle=on?"#9d7cd8":"rgba(24,27,33,.92)";ctx.fill();
      ctx.strokeStyle=on?"#e2d6f7":"rgba(157,124,216,.85)";
      ctx.lineWidth=on?2:1.5;ctx.stroke();
      const kd=PIN_KINDS.find(k=>k.id===p.kind)||PIN_KINDS[8];
      ctx.font="14px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillStyle="#fff";ctx.fillText(kd.ic,sx,sy+.5);
      if(p.title&&(on||z>=1/4)){
        ctx.font="600 11px -apple-system,sans-serif";ctx.textBaseline="top";
        const w=ctx.measureText(p.title).width;
        ctx.fillStyle="rgba(20,23,28,.86)";ctx.fillRect(sx-w/2-5,sy+r+3,w+10,16);
        ctx.fillStyle=on?"#e2d6f7":"rgba(255,255,255,.8)";ctx.fillText(p.title,sx,sy+r+5);
      }
      ctx.textAlign="left";ctx.textBaseline="alphabetic";
    }
  }

  if(hoverOn&&/brush|eraser|scatter/.test(S.tool)){
    const n=BRUSH_SIZES[S.brush];
    const[cx,cy]=s2c(hoverX,hoverY);
    const bx=Math.floor(cx/n)*n,by=Math.floor(cy/n)*n;
    const[sx,sy]=c2s(bx,by);
    ctx.strokeStyle="rgba(255,255,255,.7)";ctx.lineWidth=1.5;
    ctx.strokeRect(sx+.5,sy+.5,Math.max(4,n*z),Math.max(4,n*z));
  }
  if(rectDrag){
    const a=rectDrag.a,b=rectDrag.b;
    const x0=Math.min(a[0],b[0]),y0=Math.min(a[1],b[1]);
    const x1=Math.max(a[0],b[0])+1,y1=Math.max(a[1],b[1])+1;
    const[sx,sy]=c2s(x0,y0),[e2,f2]=c2s(x1,y1);
    ctx.fillStyle=(palList()[curIdx()]||{c:"#fff"}).c+"88";
    ctx.fillRect(sx,sy,e2-sx,f2-sy);
    ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.strokeRect(sx+.5,sy+.5,e2-sx,f2-sy);
  }
  ctx.strokeStyle=isFac()?"rgba(216,162,74,.35)":"rgba(157,124,216,.3)";ctx.lineWidth=1;
  ctx.strokeRect(ox+.5,oy+.5,ex-ox,ey-oy);
  drawMini();drawHud();
}

function drawMini(){
  const w=mcv.width,h=mcv.height;
  mctx.clearRect(0,0,w,h);mctx.fillStyle="#12151a";mctx.fillRect(0,0,w,h);
  const sx=w/FX,sy=h/FY;
  const src=(isFac()||S.show.fac)?S.claim:S.fields;
  const pal=(isFac()||S.show.fac)?S.fac:S.pal;
  for(const[k,f]of src){
    const[fx,fy]=k.split(",").map(Number);
    const hist=new Uint16Array(pal.length);
    for(let i=0;i<f.length;i+=13)if(f[i]<pal.length)hist[f[i]]++;
    let best=0,bv=0;
    for(let i=1;i<hist.length;i++)if(hist[i]>bv){bv=hist[i];best=i;}
    if(!best)continue;
    mctx.fillStyle=pal[best].c;
    mctx.fillRect(fx*sx,fy*sy,Math.ceil(sx),Math.ceil(sy));
  }
  const z=zs();
  mctx.strokeStyle=isFac()?"#d8a24a":"#9d7cd8";mctx.lineWidth=1.5;
  mctx.strokeRect((S.cam.x-VW/2/z)/WX*w,(S.cam.y-VH/2/z)/WY*h,
    Math.max(2,VW/z/WX*w),Math.max(2,VH/z/WY*h));
}

function drawHud(){
  const[cx,cy]=s2c(hoverOn?hoverX:VW/2,hoverOn?hoverY:VH/2);
  const icx=Math.floor(cx),icy=Math.floor(cy);
  const ok=icx>=0&&icy>=0&&icx<WX&&icy<WY;
  const tid=ok?cellIn(S.fields,icx,icy):0;
  const a=ok?cellIn(S.claim,icx,icy):0;
  const b=ok?cellIn(S.contest,icx,icy):0;
  let facTxt="—";
  if(ok&&a){facTxt=(S.fac[a]||{nm:"?"}).nm; if(b)facTxt+=" ⇄ "+(S.fac[b]||{nm:"?"}).nm;}
  document.getElementById("hud").innerHTML=
    `<span class="chip">폭 <b>${(VW/zs()*CM/100).toFixed(0)}m</b></span>`+
    `<span class="chip">필드 <b>${ok?(icx>>7)+","+(icy>>7):"—"}</b></span>`+
    `<span class="chip">지형 <b>${ok?(S.pal[tid]||{nm:"?"}).nm:"—"}</b></span>`+
    ((isFac()||S.show.fac)?`<span class="chip">세력 <b>${facTxt}</b></span>`:"")+
    `<span class="chip">작업 <b>${(isFac()?S.claim:S.fields).size}</b>/${FX*FY}</span>`;
}
function loop(){if(dirty){dirty=false;draw();}requestAnimationFrame(loop);}

/* ── 페인트 ── */
function stamp(cx,cy,val,scatter){
  const n=BRUSH_SIZES[S.brush];
  const bx=Math.floor(cx/n)*n,by=Math.floor(cy/n)*n,p=S.density/100;
  for(let fy=by>>7;fy<=(by+n-1)>>7;fy++)for(let fx=bx>>7;fx<=(bx+n-1)>>7;fx++)
    if(fx>=0&&fy>=0&&fx<FX&&fy<FY)snapField(fx,fy);
  let ch=false;
  for(let y=by;y<by+n;y++)for(let x=bx;x<bx+n;x++){
    if(scatter&&Math.random()>p)continue;
    if(setCell(x,y,val))ch=true;
  }
  if(ch){dirty=true;if(!isFac())S.iso=null;}
}
function line(a,b,val,scatter){
  const dx=b[0]-a[0],dy=b[1]-a[1];
  const step=Math.max(1,BRUSH_SIZES[S.brush]/2);
  const n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/step));
  for(let i=1;i<=n;i++)stamp(Math.round(a[0]+dx*i/n),Math.round(a[1]+dy*i/n),val,scatter);
}
function fillRect(a,b,val){
  const x0=clamp(Math.min(a[0],b[0]),0,WX-1),y0=clamp(Math.min(a[1],b[1]),0,WY-1);
  const x1=clamp(Math.max(a[0],b[0]),0,WX-1),y1=clamp(Math.max(a[1],b[1]),0,WY-1);
  beginStroke();
  for(let fy=y0>>7;fy<=y1>>7;fy++)for(let fx=x0>>7;fx<=x1>>7;fx++)snapField(fx,fy);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)setCell(x,y,val);
  endStroke();if(!isFac())S.iso=null;dirty=true;
}
function bucket(sx,sy,val){
  const from=getCell(sx,sy);if(from===val)return;
  const LIM=3000000,seen=new Set();beginStroke();
  const st=[sx|0,sy|0];let c=0;
  while(st.length){
    const y=st.pop(),x=st.pop();
    if(x<0||y<0||x>=WX||y>=WY)continue;
    const key=y*WX+x;if(seen.has(key))continue;
    if(getCell(x,y)!==from)continue;
    seen.add(key);snapField(x>>7,y>>7);setCell(x,y,val);
    if(++c>LIM){toast("채우기 한도(300만 셀)에 도달해 중단했습니다");break;}
    st.push(x+1,y,x-1,y,x,y+1,x,y-1);
  }
  endStroke();if(!isFac())S.iso=null;dirty=true;
}
function fillField(fx,fy,val){
  beginStroke();snapField(fx,fy);
  const t=target();
  const f=getFieldIn(t.m,fx,fy,true);f.fill(val);
  t.c.delete(fk(fx,fy));facCache.delete(fk(fx,fy));
  endStroke();if(!isFac())S.iso=null;dirty=true;renderInspector();
}

/* ═══ 입력 ═══ */
const ptrs=new Map();
let drawId=null,lastCell=null,rectDrag=null,objDrag=null;
let panId=null,panPrev=null,pinch=null;
let hoverX=0,hoverY=0,hoverOn=false;

function pos(e){
  const r=cv.getBoundingClientRect();
  let x=e.clientX-r.left,y=e.clientY-r.top;
  if(e.pointerType!=="mouse"){x+=S.penOff.x;y+=S.penOff.y;}
  return[x,y];
}
function cellOf(e){const[px,py]=pos(e);const[cx,cy]=s2c(px,py);return[Math.floor(cx),Math.floor(cy)];}
const touchList=()=>[...ptrs.values()].filter(p=>p.type==="touch");

cv.addEventListener("pointerdown",e=>{
  e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const[px,py]=pos(e);
  ptrs.set(e.pointerId,{x:px,y:py,type:e.pointerType});
  hoverX=px;hoverY=py;hoverOn=true;

  const t=touchList();
  if(t.length>=2){
    abortDraw();
    const[a,b]=t;
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
    panId=null;panPrev=null;return;
  }
  const forcePan=e.pointerType==="mouse"&&(e.button===1||e.button===2||e.shiftKey);
  if(forcePan||S.tool==="pan"||(e.pointerType==="touch"&&!S.fingerDraw)){
    panId=e.pointerId;panPrev={x:px,y:py};
    cv.style.cursor="grabbing";return;
  }
  if(e.pointerType==="mouse"&&e.button!==0)return;
  startDraw(e);
});

function startDraw(e){
  const[icx,icy]=cellOf(e);
  const[px,py]=pos(e);

  if(isFac()){
    // 세력 레이어: 거점 우선 히트
    const hh=hitHold(px,py);
    if(hh&&S.tool!=="pin"){selectHold(hh.id);return;}
    if(S.tool==="pin"){
      if(hh){selectHold(hh.id);objDrag={kind:"hold",o:hh};drawId=e.pointerId;return;}
      addHold(icx,icy);return;
    }
  }else if(wideMode()||S.show.pins){
    const hp=hitPin(px,py);
    if(hp&&S.tool!=="pin"){selectPin(hp.id);return;}
    if(S.tool==="pin"){
      if(hp){selectPin(hp.id);objDrag={kind:"pin",o:hp};drawId=e.pointerId;return;}
      addPin(icx,icy);return;
    }
  }
  if(icx<0||icy<0||icx>=WX||icy>=WY)return;
  const val=curIdx();
  drawId=e.pointerId;lastCell=[icx,icy];
  switch(S.tool){
    case"brush":  beginStroke();stamp(icx,icy,val,false);selectField(icx>>7,icy>>7,true);break;
    case"scatter":beginStroke();stamp(icx,icy,val,true); selectField(icx>>7,icy>>7,true);break;
    case"eraser": beginStroke();stamp(icx,icy,0,false);  selectField(icx>>7,icy>>7,true);break;
    case"rect":   rectDrag={a:[icx,icy],b:[icx,icy]};break;
    case"bucket": bucket(icx,icy,val);selectField(icx>>7,icy>>7,true);drawId=null;break;
    case"pick":   {const id=getCell(icx,icy);if(id){if(isFac())S.faction=id;else S.terrain=id;renderPalette();}drawId=null;break;}
    case"select": selectField(icx>>7,icy>>7);drawId=null;break;
  }
}
function abortDraw(){
  if(rectDrag)rectDrag=null;
  if(drawId!==null){endStroke();drawId=null;lastCell=null;objDrag=null;}
  dirty=true;
}

cv.addEventListener("pointermove",e=>{
  const[px,py]=pos(e);
  const rec=ptrs.get(e.pointerId);
  if(rec){rec.x=px;rec.y=py;}
  hoverX=px;hoverY=py;hoverOn=true;dirty=true;

  if(pinch){
    const t=touchList();
    if(t.length>=2){
      const[a,b]=t;
      const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      if(pinch.d>0){
        const z=zs();
        S.cam.x-=(mx-pinch.mx)/z;S.cam.y-=(my-pinch.my)/z;
        setScale(S.scale*(d/pinch.d),mx,my);
      }
      pinch={d,mx,my};clampCam();
    }
    return;
  }
  if(panId===e.pointerId&&panPrev){
    const z=zs();
    S.cam.x-=(px-panPrev.x)/z;S.cam.y-=(py-panPrev.y)/z;
    panPrev={x:px,y:py};clampCam();return;
  }
  if(drawId!==e.pointerId)return;
  const[icx,icy]=cellOf(e);
  if(objDrag){objDrag.o.cx=clamp(icx,0,WX-1);objDrag.o.cy=clamp(icy,0,WY-1);touchSave();return;}
  if(rectDrag){rectDrag.b=[clamp(icx,0,WX-1),clamp(icy,0,WY-1)];return;}
  const cur=[icx,icy],val=curIdx();
  if(S.tool==="brush")   line(lastCell||cur,cur,val,false);
  if(S.tool==="scatter") line(lastCell||cur,cur,val,true);
  if(S.tool==="eraser")  line(lastCell||cur,cur,0,false);
  lastCell=cur;
});

function upPtr(e){
  ptrs.delete(e.pointerId);
  if(pinch&&touchList().length<2)pinch=null;
  if(panId===e.pointerId){panId=null;panPrev=null;cv.style.cursor=S.tool==="pan"?"grab":"crosshair";}
  if(drawId===e.pointerId){
    if(rectDrag){fillRect(rectDrag.a,rectDrag.b,curIdx());rectDrag=null;}
    if(objDrag){objDrag=null;renderInspector();}
    endStroke();drawId=null;lastCell=null;
  }
  dirty=true;
}
cv.addEventListener("pointerup",upPtr);
cv.addEventListener("pointercancel",upPtr);
cv.addEventListener("pointerleave",e=>{if(e.pointerType!=="touch"){hoverOn=false;dirty=true;}});
cv.addEventListener("contextmenu",e=>e.preventDefault());
cv.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  setScale(S.scale*Math.pow(2,-e.deltaY/300),e.clientX-r.left,e.clientY-r.top);
},{passive:false});
["gesturestart","gesturechange","gestureend"].forEach(g=>
  document.addEventListener(g,e=>e.preventDefault(),{passive:false}));

(function(){
  const el=document.getElementById("mini");
  const jump=ev=>{
    const r=mcv.getBoundingClientRect();
    S.cam.x=clamp((ev.clientX-r.left)/r.width*WX,0,WX);
    S.cam.y=clamp((ev.clientY-r.top)/r.height*WY,0,WY);
    clampCam();dirty=true;
  };
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    jump(e);
  });
  el.addEventListener("pointermove",e=>{
    if(el.hasPointerCapture&&el.hasPointerCapture(e.pointerId))jump(e);
  });
})();

document.getElementById("zIn").onclick=()=>setScale(S.scale*2);
document.getElementById("zOut").onclick=()=>setScale(S.scale/2);

window.addEventListener("keydown",e=>{
  if(/input|textarea|select/i.test(e.target.tagName))return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undo();return;}
  const m={b:"brush",r:"rect",g:"bucket",e:"eraser",s:"scatter",v:"select",p:"pin",i:"pick",h:"pan"};
  const k=e.key.toLowerCase();
  if(k==="l"){setLayer(isFac()?"terrain":"faction");return;}
  if(m[k]){setTool(m[k]);return;}
  if(k>="1"&&k<="5"){setScale(ZOOMS[+k-1].s);renderInspector();return;}
  if(e.key==="["){S.brush=clamp(S.brush-1,0,6);syncBrush();}
  if(e.key==="]"){S.brush=clamp(S.brush+1,0,6);syncBrush();}
  if(e.key==="Delete"||e.key==="Backspace"){
    if(S.selHold)delHold(S.selHold);else if(S.selPin)delPin(S.selPin);
  }
});

function hitPin(px,py){
  for(let i=S.pins.length-1;i>=0;i--){
    const p=S.pins[i],[sx,sy]=c2s(p.cx,p.cy);
    if((px-sx)**2+(py-sy)**2<324)return p;
  }
  return null;
}
function hitHold(px,py){
  for(let i=S.holds.length-1;i>=0;i--){
    const h=S.holds[i],[sx,sy]=c2s(h.cx,h.cy);
    if((px-sx)**2+(py-sy)**2<289)return h;
  }
  return null;
}

/* ── 선택 ── */
function selectField(fx,fy,quiet){
  if(fx<0||fy<0||fx>=FX||fy>=FY)return;
  const same=S.selField&&S.selField[0]===fx&&S.selField[1]===fy;
  S.selField=[fx,fy];S.selPin=null;S.selHold=null;
  if(!same||!quiet)renderInspector();
  dirty=true;
}
function selectPin(id){S.selPin=id;S.selHold=null;renderInspector();openInsp();dirty=true;}
function selectHold(id){S.selHold=id;S.selPin=null;renderInspector();openInsp();dirty=true;}
function addPin(cx,cy){
  const p={id:S.pinSeq++,cx:clamp(cx,0,WX-1),cy:clamp(cy,0,WY-1),kind:"lore",title:"",notes:""};
  S.pins.push(p);S.selPin=p.id;S.selHold=null;renderInspector();openInsp();dirty=true;touchSave();
}
function delPin(id){
  S.pins=S.pins.filter(p=>p.id!==id);
  if(S.selPin===id)S.selPin=null;
  renderInspector();dirty=true;touchSave();
}
function addHold(cx,cy){
  const h={id:S.holdSeq++,cx:clamp(cx,0,WX-1),cy:clamp(cy,0,WY-1),
    fac:S.faction||1,type:"village",nm:"",notes:"",r:0};
  S.holds.push(h);S.selHold=h.id;S.selPin=null;renderInspector();openInsp();dirty=true;touchSave();
}
function delHold(id){
  S.holds=S.holds.filter(h=>h.id!==id);
  if(S.selHold===id)S.selHold=null;
  renderInspector();dirty=true;touchSave();
}

/* ── 레이어 ── */
function setLayer(l){
  if(S.layer===l)return;
  S.layer=l;
  document.body.classList.toggle("faclayer",isFac());
  document.querySelectorAll(".lbtn").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  document.getElementById("lockNote").style.display=isFac()?"block":"none";
  document.getElementById("contestWrap").style.display=isFac()?"flex":"none";
  document.getElementById("btnAuto").style.display=isFac()?"flex":"none";
  document.getElementById("palttl").textContent=isFac()?"세력":"지형";
  if(isFac()){document.getElementById("cFac").checked=true;S.show.fac=true;syncFacUI();}
  S.selPin=null;S.selHold=null;
  closeTE();renderTools();renderPalette();renderInspector();dirty=true;
  toast(isFac()?"세력 레이어 — 지형 편집이 잠깁니다":"지형 레이어");
}
document.querySelectorAll(".lbtn").forEach(b=>b.onclick=()=>setLayer(b.dataset.l));

/* ── 도구 ── */
const TOOLS=[

  const list=palList(),sel=curIdx();
  document.getElementById("pal").innerHTML=list.map((p,i)=>i===0?"":
    `<div class="pitem ${sel===i?"on":""}" data-i="${i}">

      <span class="ed" data-e="${i}">⋯</span></div>`).join("");
  document.querySelectorAll(".pitem").forEach(b=>{
    b.onclick=e=>{
      if(e.target.dataset&&e.target.dataset.e!==undefined){openTerrainEdit(+e.target.dataset.e);return;}
      const i=+b.dataset.i;
      if(isFac())S.faction=i;else S.terrain=i;
      if(/eraser|select|pick/.test(S.tool))setTool("brush");
      renderPalette();
      if(S.selHold!==null&&isFac()){
        const h=S.holds.find(x=>x.id===S.selHold);
        if(h){h.fac=i;renderInspector();touchSave();}

function openTerrainEdit(i){
  const list=palList(),p=list[i],fac=isFac();
  document.getElementById("paledithost").innerHTML=
    `<div class="paledit">
      <div class="r"><input type="color" id="teC" value="${p.c}"><input type="text" id="teN" value="${esc(p.nm)}" placeholder="${fac?"세력":"지형"} 이름"></div>
      ${fac?"":`<label class="chk" style="margin:0 0 8px;flex-direction:row"><input type="checkbox" id="teW" ${p.walk?"checked":""}><span>통행 가능</span></label>`}
      <div class="btns"><button class="pri" id="teOk">적용</button><button id="teX">취소</button>
      ${i>=1?'<button class="del" id="teD">삭제</button>':''}</div></div>`;
  document.getElementById("teOk").onclick=()=>{
    p.c=document.getElementById("teC").value;
    p.nm=document.getElementById("teN").value.trim()||p.nm;
    if(!fac)p.walk=document.getElementById("teW").checked;
    rebuildPal();cache.clear();facCache.clear();
    closeTE();renderPalette();renderInspector();dirty=true;touchSave();
  };
  document.getElementById("teX").onclick=closeTE;
  const d=document.getElementById("teD");
  if(d)d.onclick=()=>{
    const what=fac?"세력":"지형";
    if(!confirm(`"${p.nm}"을 삭제하면 이 ${what}으로 칠한 영역이 모두 미지정이 됩니다. 계속할까요?`))return;
    const maps=fac?[S.claim,S.contest]:[S.fields];
    for(const m of maps)for(const[k,f]of m){
      for(let j=0;j<f.length;j++){if(f[j]===i)f[j]=0;else if(f[j]>i)f[j]--;}
    }
    if(fac){
      for(const h of S.holds){if(h.fac===i)h.fac=0;else if(h.fac>i)h.fac--;}
      S.fac.splice(i,1);
      if(S.faction>=S.fac.length)S.faction=Math.max(1,S.fac.length-1);
    }else{
      S.pal.splice(i,1);
      if(S.terrain>=S.pal.length)S.terrain=Math.max(1,S.pal.length-1);
    }
    rebuildPal();cache.clear();facCache.clear();
    closeTE();renderPalette();renderInspector();
    S.iso=null;dirty=true;touchSave();
  };
}
const closeTE=()=>document.getElementById("paledithost").innerHTML="";
document.getElementById("btnAddT").onclick=()=>{
  if(isFac()){
    S.fac.push({nm:"새 세력 "+S.fac.length,c:"#7ad0a0"});
    rebuildPal();S.faction=S.fac.length-1;renderPalette();openTerrainEdit(S.fac.length-1);

    rebuildPal();S.terrain=S.pal.length-1;renderPalette();openTerrainEdit(S.pal.length-1);
  }
  touchSave();
};

function compoOf(m,pal,f){
  if(!f)return{compo:"",bar:"",filled:0};
  const hist=new Uint32Array(pal.length);
  for(let i=0;i<f.length;i++)if(f[i]<pal.length)hist[f[i]]++;
  const filled=1-hist[0]/f.length;
  const rows=[];for(let i=1;i<hist.length;i++)if(hist[i])rows.push([i,hist[i]]);
  rows.sort((a,c)=>c[1]-a[1]);
  const compo=rows.slice(0,8).map(([i,n])=>{
    const pc=n/f.length*100;
    return `<div class="crow"><span class="sw" style="background:${pal[i].c}"></span>
      <span class="nm">${esc(pal[i].nm)}</span><span class="pc">${pc<1?"<1":pc.toFixed(0)}%</span></div>`;
  }).join("");
  const bar=`<div class="bar">${rows.map(([i,n])=>`<div style="background:${pal[i].c};width:${n/f.length*100}%"></div>`).join("")}${hist[0]?`<div style="background:#232830;width:${hist[0]/f.length*100}%"></div>`:""}</div>`;
  return{compo,bar,filled};
}

        return `<div class="crow"><span style="width:14px;text-align:center;color:${(S.fac[h.fac]||{c:"#888"}).c}">${t.sym}</span>

    <div class="fld"><label>태그 (쉼표로 구분)</label><input type="text" id="mTags" value="${esc(m.tags)}" placeholder="예: 1장, 순찰병, 야간"></div>

}
function wireFieldPanel(){
  const b=document.getElementById("inspbody");
  const[fx,fy]=S.selField,m=getMeta(fx,fy,true);
  b.querySelectorAll(".nb").forEach(x=>x.onclick=()=>{
    const d=x.dataset.d;let nx=S.selField[0],ny=S.selField[1];
    if(d==="l")nx--;if(d==="r")nx++;if(d==="u")ny--;if(d==="d")ny++;
    nx=clamp(nx,0,FX-1);ny=clamp(ny,0,FY-1);S.selField=[nx,ny];
    S.cam.x=nx*CPF+CPF/2;S.cam.y=ny*CPF+CPF/2;clampCam();renderInspector();dirty=true;
  });
  b.querySelectorAll("[data-a]").forEach(x=>x.onclick=()=>{
    const a=x.dataset.a;
    if(a==="fill")fillField(fx,fy,curIdx());
    if(a==="clear"){if(confirm(`필드 ${fx},${fy}의 ${isFac()?"세력 주장":"지형"}을 비웁니다.`))fillField(fx,fy,0);}
    if(a==="goto"){S.cam.x=fx*CPF+CPF/2;S.cam.y=fy*CPF+CPF/2;setScale(4);}
  });
  const bind=(id,key)=>{const el=document.getElementById(id);
    el.oninput=()=>{m[key]=el.value;touchSave();if(key==="nm")dirty=true;};};
  bind("mName","nm");bind("mTags","tags");bind("mNotes","notes");
  document.getElementById("mStat").onchange=e=>{m.status=e.target.value;touchSave();};
}

/* 펜 시차 보정 — 기기마다 다르므로 지도 데이터와 분리해 저장 */
const PEN_KEY="darronoa-pen-offset";
const poxEl=document.getElementById("pox"),poyEl=document.getElementById("poy");
function syncPen(save){
  poxEl.value=S.penOff.x;poyEl.value=S.penOff.y;
  document.getElementById("poxv").textContent=(S.penOff.x>0?"+":"")+S.penOff.x;
  document.getElementById("poyv").textContent=(S.penOff.y>0?"+":"")+S.penOff.y;
  if(save){try{localStorage.setItem(PEN_KEY,JSON.stringify(S.penOff));}catch(_){}}
  dirty=true;
}
poxEl.oninput=()=>{S.penOff.x=+poxEl.value;syncPen(true);};
poyEl.oninput=()=>{S.penOff.y=+poyEl.value;syncPen(true);};
document.getElementById("btnPenReset").onclick=()=>{S.penOff={x:0,y:0};syncPen(true);toast("펜 보정을 0으로 되돌렸습니다");};
try{const s=JSON.parse(localStorage.getItem(PEN_KEY));if(s&&typeof s.x==="number")S.penOff=s;}catch(_){}

const bsEl=document.getElementById("bs"),denEl=document.getElementById("den");
function syncBrush(){
  bsEl.value=S.brush;const n=BRUSH_SIZES[S.brush];
  document.getElementById("bsv").textContent=`${n}셀 · ${(n*CM/100).toFixed(n*CM<100?1:0)}m`;
  dirty=true;
}
bsEl.oninput=()=>{S.brush=+bsEl.value;syncBrush();};
denEl.oninput=()=>{S.density=+denEl.value;document.getElementById("denv").textContent=S.density+"%";};

document.getElementById("btnReset").onclick=()=>{
  if(isFac()){
    if(!confirm("세력 주장·분쟁·거점을 모두 지웁니다. 지형은 그대로 둡니다."))return;
    S.claim.clear();S.contest.clear();S.holds=[];S.selHold=null;facCache.clear();
  }else{
    if(!confirm("지형·필드 메모·로어 핀을 지웁니다. 세력 데이터는 그대로 둡니다."))return;
    S.fields.clear();S.meta.clear();S.pins=[];S.selPin=null;cache.clear();S.iso=null;
  }
  S.selField=null;undoStack.length=0;renderInspector();dirty=true;touchSave();
};

/* ── 통계 ── */
function showStats(){
  const areaT=new Float64Array(S.pal.length),areaF=new Float64Array(S.fac.length);
  let conCells=0;
  for(const[,f]of S.fields)for(let i=0;i<f.length;i++)if(f[i]<areaT.length)areaT[f[i]]++;
  for(const[,f]of S.claim)for(let i=0;i<f.length;i++)if(f[i]<areaF.length)areaF[f[i]]++;
  for(const[,f]of S.contest)for(let i=0;i<f.length;i++)if(f[i])conCells++;

  const holdCount={};
  for(const h of S.holds){holdCount[h.fac]=holdCount[h.fac]||{};
    holdCount[h.fac][h.type]=(holdCount[h.fac][h.type]||0)+1;}

  // 국경 접촉 — 1/4 해상도에서 인접 쌍 집계
  const g=new Uint8Array(IW*IH);
  for(const[k,f]of S.claim){
    const[fx,fy]=k.split(",").map(Number),bx=fx*CPF/IR,by=fy*CPF/IR,n=CPF/IR;
    for(let y=0;y<n;y++)for(let x=0;x<n;x++)g[(by+y)*IW+bx+x]=f[(y*IR)*CPF+x*IR];
  }
  const pairs=new Map();
  for(let y=0;y<IH;y++)for(let x=0;x<IW;x++){
    const a=g[y*IW+x];if(!a)continue;
    for(const[dx,dy]of[[1,0],[0,1]]){
      const nx=x+dx,ny=y+dy;if(nx>=IW||ny>=IH)continue;
      const b=g[ny*IW+nx];if(!b||b===a)continue;
      const key=a<b?a+"-"+b:b+"-"+a;
      pairs.set(key,(pairs.get(key)||0)+1);
    }
  }
  const borders=[...pairs.entries()].sort((p,q)=>q[1]-p[1]).slice(0,12);
  const m2=n=>Number((n*CELL_M2).toFixed(0)).toLocaleString();

  const facRows=S.fac.map((f,i)=>{
    if(i===0||!areaF[i]&&!holdCount[i])return"";
    const hc=holdCount[i]||{};
    const hs=HOLD_TYPES.filter(t=>hc[t.id]).map(t=>`${t.sym}${hc[t.id]}`).join(" ")||"—";
    return `<tr><td><span class="sw" style="display:inline-block;background:${f.c};margin-right:5px"></span>${esc(f.nm)}</td>
      <td class="n">${m2(areaF[i])}㎡</td><td class="n">${hs}</td></tr>`;
  }).join("");

  const terRows=S.pal.map((p,i)=>i===0||!areaT[i]?"":
    `<tr><td><span class="sw" style="display:inline-block;background:${p.c};margin-right:5px"></span>${esc(p.nm)}</td>
     <td class="n">${m2(areaT[i])}㎡</td><td class="n">${p.walk?"":"벽"}</td></tr>`).join("");

  document.getElementById("sheetbox").innerHTML=
    `<h3>통계</h3>
     <p>작업 필드 ${S.fields.size} / ${FX*FY} · 거점 ${S.holds.length}개 · 로어 핀 ${S.pins.length}개${conCells?` · 분쟁 지역 ${m2(conCells)}㎡`:""}</p>
     ${facRows?`<table class="st"><tr><th>세력</th><th style="text-align:right">영역</th><th style="text-align:right">거점</th></tr>${facRows}</table>`
              :`<p style="color:var(--txt-faint)">아직 세력 데이터가 없습니다.</p>`}
     ${borders.length?`<table class="st"><tr><th>국경 접촉</th><th style="text-align:right">접촉 길이</th></tr>
       ${borders.map(([k,v])=>{const[a,b]=k.split("-").map(Number);
         return `<tr><td>${esc((S.fac[a]||{}).nm)} ↔ ${esc((S.fac[b]||{}).nm)}</td>
         <td class="n">${(v*IR*CM/100).toFixed(0)}m</td></tr>`;}).join("")}</table>`:""}
     ${terRows?`<table class="st"><tr><th>지형</th><th style="text-align:right">면적</th><th></th></tr>${terRows}</table>`:""}
     <button class="close" id="shX">닫기</button>`;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("shX").onclick=closeSheet;
}
document.getElementById("btnStats").onclick=()=>{
  const b=document.getElementById("btnStats");b.classList.add("busy");
  setTimeout(()=>{try{showStats();}finally{b.classList.remove("busy");}},20);
};

/* ── 저장 ── */
function b64(u){let s="",C=0x8000;for(let i=0;i<u.length;i+=C)s+=String.fromCharCode.apply(null,u.subarray(i,i+C));return btoa(s);}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function packMap(m){
  const o={};
  for(const[k,f]of m){
    let u=f[0],uni=true;
    for(let i=1;i<f.length;i++)if(f[i]!==u){uni=false;break;}
    if(uni){if(u!==0)o[k]={u};}else o[k]={d:b64(f)};
  }
  return o;
}
function unpackMap(o,m){
  m.clear();
  for(const k in o||{}){
    const e=o[k];
    if(e.u!=null){const f=new Uint8Array(CPF*CPF);f.fill(e.u);m.set(k,f);}
    else if(e.d)m.set(k,unb64(e.d));
  }
}
function serialize(){
  const meta={};
  for(const[k,m]of S.meta)if(m.nm||m.tags||m.notes||m.status!=="미착수")meta[k]=m;
  return{format:"darronoa-worldmap",version:2,
    grid:{fieldsX:FX,fieldsY:FY,cellsPerField:CPF,cmPerCell:CM,gamePxPerCell:GPX},
    palette:S.pal, factions:S.fac,
    fields:packMap(S.fields), claim:packMap(S.claim), contest:packMap(S.contest),
    meta, pins:S.pins, pinSeq:S.pinSeq, holds:S.holds, holdSeq:S.holdSeq,
    savedAt:new Date().toISOString()};
}
function deserialize(o){
  if(!o||o.format!=="darronoa-worldmap")throw new Error("이 툴의 저장 파일이 아닙니다");
  S.pal=o.palette&&o.palette.length?o.palette:DEFAULT_PALETTE.map(p=>({...p}));
  S.fac=o.factions&&o.factions.length?o.factions:DEFAULT_FACTIONS.map(p=>({...p}));
  rebuildPal();cache.clear();facCache.clear();
  unpackMap(o.fields,S.fields);
  unpackMap(o.claim,S.claim);
  unpackMap(o.contest,S.contest);
  S.meta.clear();
  for(const k in o.meta||{})S.meta.set(k,o.meta[k]);
  S.pins=(o.pins||[]).map(p=>({...p,kind:PIN_LEGACY[p.kind]||p.kind}));
  S.pinSeq=o.pinSeq||(S.pins.reduce((a,p)=>Math.max(a,p.id),0)+1);
  S.holds=o.holds||[];
  S.holdSeq=o.holdSeq||(S.holds.reduce((a,h)=>Math.max(a,h.id),0)+1);
  S.selField=null;S.selPin=null;S.selHold=null;S.iso=null;undoStack.length=0;
  if(S.terrain>=S.pal.length)S.terrain=1;
  if(S.faction>=S.fac.length)S.faction=1;
  renderPalette();renderInspector();dirty=true;
}
function download(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}
document.getElementById("btnSave").onclick=()=>{
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  download(new Blob([JSON.stringify(serialize())],{type:"application/json"}),
    `darronoa-worldmap-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.json`);
  unsaved=false;setSaveState("파일로 저장함");
  toast("저장했습니다. 파일 앱에서 원하는 위치에 두세요.");
};
document.getElementById("btnLoad").onclick=()=>document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{deserialize(JSON.parse(r.result));toast("불러왔습니다");touchSave();}
                catch(err){toast("열 수 없습니다 — "+err.message);}};
  r.readAsText(f);e.target.value="";
};

/* ── PNG 내보내기 ── */
function exportPNG(y0,y1,which,label){
  const h=(y1-y0)*CPF;
  const c=document.createElement("canvas");c.width=WX;c.height=h;
  const x=c.getContext("2d");
  x.fillStyle="#000";x.fillRect(0,0,WX,h);x.imageSmoothingEnabled=false;
  const src=which==="fac"?S.claim:S.fields;
  for(const[k]of src){
    const[fx,fy]=k.split(",").map(Number);
    if(fy<y0||fy>=y1)continue;
    const fc=which==="fac"?facCanvas(fx,fy):fieldCanvas(fx,fy);
    if(fc)x.drawImage(fc,fx*CPF,(fy-y0)*CPF);
  }
  closeSheet();
  c.toBlob(b=>{
    if(!b){toast("이미지 생성 실패. 더 작은 구역으로 나눠보세요.");return;}
    download(b,`darronoa-${which}-${label}.png`);
    toast(`${which==="fac"?"세력도":"지형 마스크"}를 내려받았습니다 (${WX}×${h})`);
  },"image/png");
}
function closeSheet(){document.getElementById("sheet").classList.remove("on");}
document.getElementById("sheet").onclick=e=>{if(e.target.id==="sheet")closeSheet();};
document.getElementById("btnPng").onclick=()=>{
  const which=isFac()?"fac":"terrain";
  const parts=[[0,12],[12,24],[24,36],[36,48]];
  document.getElementById("sheetbox").innerHTML=
    `<h3>${which==="fac"?"세력도":"지형 마스크"} PNG 내보내기</h3>
     <p>${which==="fac"?"세력 경계를 한눈에 보는 지도입니다. 분쟁 지역은 사선으로 섞여 나옵니다."
        :"AI 생성이나 배경 작업의 구조 참조로 쓰는 이미지입니다."}
        아이패드에서는 전체 한 장(${WX}×${WY})이 캔버스 한계를 넘어 실패할 수 있어, 4구역으로 나눠 받는 쪽을 권합니다.
        현재 레이어(${which==="fac"?"세력":"지형"})가 대상입니다.</p>
     <div class="opt">
       ${parts.map(([a,b],i)=>`<button data-y0="${a}" data-y1="${b}">구역 ${i+1} · 필드 행 ${a}–${b-1}<small>${WX} × ${(b-a)*CPF}px · 약 ${((b-a)*CPF*WX/1e6).toFixed(1)}메가픽셀</small></button>`).join("")}
       <button data-y0="0" data-y1="48">전체 한 장<small>${WX} × ${WY}px · ${(WX*WY/1e6).toFixed(1)}메가픽셀 · 데스크톱 권장</small></button>
     </div><button class="close" id="shX">닫기</button>`;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("shX").onclick=closeSheet;
  document.querySelectorAll("#sheetbox .opt button").forEach(b=>b.onclick=()=>{
    const y0=+b.dataset.y0,y1=+b.dataset.y1;
    exportPNG(y0,y1,which,(y1-y0===48)?"full":`rows${y0}-${y1-1}`);
  });
};

/* ── 자동 저장 ── */
let store=null;
try{localStorage.setItem("__t","1");localStorage.removeItem("__t");store="ls";}catch(e){}
let saveT=null;
function setSaveState(t,warn){
  const el=document.getElementById("savestate");
  el.textContent=t;el.classList.toggle("unsaved",!!warn);
}
function touchSave(){
  unsaved=true;
  if(!store){setSaveState("자동 저장 불가 · 저장 버튼을 쓰세요",true);return;}
  setSaveState("변경됨",true);
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{
      localStorage.setItem("darronoa-worldmap",JSON.stringify(serialize()));
      const d=new Date(),p=n=>String(n).padStart(2,"0");
      setSaveState(`자동 저장 ${p(d.getHours())}:${p(d.getMinutes())}`);
      unsaved=false;
    }catch(e){store=null;setSaveState("용량 초과 · 파일로 저장하세요",true);}
  },1500);
}
function restore(){
  if(!store){setSaveState("자동 저장 불가 · 저장 버튼을 쓰세요",true);return;}
  try{
    const raw=localStorage.getItem("darronoa-worldmap");
    if(raw){deserialize(JSON.parse(raw));setSaveState("이전 작업 복원");}
    else setSaveState("자동 저장 켜짐");
  }catch(e){setSaveState("자동 저장 켜짐");}
}
window.addEventListener("beforeunload",e=>{if(unsaved){e.preventDefault();e.returnValue="";}});

let toastT=null;
function toast(m){
  const el=document.getElementById("toast");
  el.textContent=m;el.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2800);
}

/* ── 시작 ── */
renderTools();renderZoom();renderPalette();syncBrush();syncPen(false);syncFacUI();
resize();restore();renderInspector();clampCam();
requestAnimationFrame(loop);
if(window.matchMedia("(pointer:coarse)").matches)
  setTimeout(()=>toast("펜슬로 그리고, 손가락으로 밀거나 두 손가락으로 확대하세요"),700);
</script>
